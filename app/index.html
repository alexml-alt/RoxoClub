const fmtDate = (iso) => {
  if(!iso) return "—";
  const s=iso.split("T")[0].split("-");
  if(s.length<3) return "—";
  return s[2]+"/"+s[1]+"/"+s[0];
};
const fmtDateTime= (iso) => iso ? new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";
const fmtPts     = (n)   => Number(n||0).toLocaleString("pt-BR");
const fmtMoney   = (n)   => Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fmtMoneyMask = (v) => {
  var d=(v||"").replace(/[^0-9]/g,"");
  if(!d) return "";
  var n=parseInt(d,10);
  var cents=(n%100).toString().padStart(2,"0");
  var reais=Math.floor(n/100).toString();
  return reais+","+cents;
};
const parseMoney = (v) => {
  var d=(v||"").replace(/[^0-9]/g,"");
  if(!d) return 0;
  return parseInt(d,10)/100;
};
const today      = ()    => new Date().toISOString().split("T")[0];
const daysDiff   = (iso) => iso ? Math.floor((Date.now()-new Date(iso))/(86400000)) : 9999;
const hourOfDay  = (iso) => iso ? new Date(iso).getHours() : null;
const isBirthday = (dob) => {
  if(!dob) return false;
  const s=dob.split("T")[0].split("-");
  if(s.length<3) return false;
  const now=new Date();
  return parseInt(s[2])===now.getDate() && parseInt(s[1])-1===now.getMonth();
};
const birthMonth = (dob) => dob ? new Date(dob).getMonth() : null;
const age = (dob) => {
  if(!dob) return null;
  const d=new Date(dob), now=new Date();
  let a=now.getFullYear()-d.getFullYear();
  if(now.getMonth()<d.getMonth()||(now.getMonth()===d.getMonth()&&now.getDate()<d.getDate())) a--;
  return a;
};
const fmtPhone = (v) => {
  const d=(v||"").replace(/\D/g,"");
  if(d.length<=2) return d;
  if(d.length<=6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length<=10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7,11)}`;
};
const rawPhone = (v) => (v||"").replace(/\D/g,"");

const fmtDobMask = (v) => {
  const d=(v||"").replace(/\D/g,"");
  if(d.length<=2) return d;
  if(d.length<=4) return d.slice(0,2)+"/"+d.slice(2);
  return d.slice(0,2)+"/"+d.slice(2,4)+"/"+d.slice(4,8);
};
const dobMaskToISO = (v) => {
  const d=(v||"").replace(/\D/g,"");
  if(d.length<8) return "";
  return d.slice(4,8)+"-"+d.slice(2,4)+"-"+d.slice(0,2);
};
const isoToDobMask = (iso) => {
  if(!iso||iso.length<10) return "";
  const [y,m,d]=iso.split("-");
  return (d||"")+"/"+(m||"")+"/"+(y||"");
};

const genTempPassword = () => {
  const upper="ABCDEFGHJKLMNPQRSTUVWXYZ";
  const lower="abcdefghjkmnpqrstuvwxyz";
  const nums="23456789";
  const all=upper+lower+nums;
  var pass="";
  // guarantee at least 2 upper, 2 lower, 2 numbers
  pass+=upper[Math.floor(Math.random()*upper.length)];
  pass+=lower[Math.floor(Math.random()*lower.length)];
  pass+=nums[Math.floor(Math.random()*nums.length)];
  pass+=upper[Math.floor(Math.random()*upper.length)];
  pass+=lower[Math.floor(Math.random()*lower.length)];
  pass+=nums[Math.floor(Math.random()*nums.length)];
  // fill remaining 2 chars
  for(var i=0;i<2;i++) pass+=all[Math.floor(Math.random()*all.length)];
  // shuffle
  return pass.split("").sort(()=>Math.random()-0.5).join("");
};

const waLink = (phone,msg) => {
  const n=(phone||"").replace(/\D/g,"");
  const num=n.startsWith("55")?n:"55"+n;
  const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const encoded=encodeURIComponent(msg);
  if(isMobile) return "https://wa.me/"+num+"?text="+encoded;
  return "https://api.whatsapp.com/send?phone="+num+"&text="+encoded;
};

const getPreferredHour = (txList) => {
  if(!txList||!txList.length) return null;
  const hours={};
  txList.forEach(t=>{const h=hourOfDay(t.created_at);if(h!==null){hours[h]=(hours[h]||0)+1;}});
  return Object.entries(hours).sort((a,b)=>b[1]-a[1])[0]?.[0];
};

const api = {
  signIn:  (e,p) => sb.auth.signInWithPassword({email:e,password:p}),
  signUp:  (e,p) => sb.auth.signUp({email:e,password:p}),
  signOut: ()    => sb.auth.signOut(),

  getStore:    (uid)       => sb.from("stores").select("*").eq("owner_id",uid).maybeSingle(),
  updateStorePlan:(id,d)   => sb.from("stores").update(d).eq("id",id),
  markContacted:(ids)      => sb.from("clients").update({last_contacted_at:new Date().toISOString()}).in("id",ids),
  createStore: (uid,n,s,p) => sb.from("stores").insert({owner_id:uid,name:n,slug:s,phone:p,settings:DEFAULT_SETTINGS}).select().single(),
  updateSettings:(id,set)  => sb.from("stores").update({settings:set}).eq("id",id),

  listAttendants:  (sid)    => sb.from("attendants").select("*").eq("store_id",sid).order("name"),
  createAttendant: (sid,d)  => sb.from("attendants").insert({store_id:sid,...d}).select().single(),

  listRatings:    (sid) => sb.from("ratings").select("*,attendants(name)").eq("store_id",sid).order("created_at",{ascending:false}).limit(200),
  createRating:   (d)   => sb.from("ratings").insert(d).select().single(),

  submitRating:   (id,stars,comment) => sb.from("ratings").update({stars,comment,rated_at:new Date().toISOString()}).eq("id",id),

  listClients: (sid) => sb.from("clients").select("*").eq("store_id",sid).order("points",{ascending:false}),
  createClient:(sid,d) => sb.from("clients").insert({store_id:sid,...d}).select().single(),
  updateClient:(id,d)  => sb.from("clients").update(d).eq("id",id).select().maybeSingle(),
  deleteClient:(id)    => sb.from("clients").delete().eq("id",id),
  clientByToken:(tok)  => sb.from("clients").select("*,stores(name,slug,settings,phone)").eq("magic_token",tok).maybeSingle(),

  listTx:     (sid,lim=200) => sb.from("transactions").select("*,clients(name,phone)").eq("store_id",sid).order("created_at",{ascending:false}).limit(lim),
  listClientTx:(cid)        => sb.from("transactions").select("*").eq("client_id",cid).order("created_at",{ascending:false}).limit(60),

  addPoints: async (sid,cid,amount,note,settings,attendant_id) => {
    const pts = Math.floor(amount*(settings.points_per_real||3));
    const {data:tx,error} = await sb.from("transactions").insert({
      store_id:sid,client_id:cid,type:"earn",points:pts,amount_paid:amount,note:note||null,
      ...(attendant_id?{attendant_id}:{})
    }).select().single();
    if(error) return {error};
    const {data:c} = await sb.from("clients").select("points,total_visits").eq("id",cid).single();
    const newPts = (c?.points||0)+pts;
    const newLevel = getLevel(newPts,settings.levels||DEFAULT_SETTINGS.levels);

  cancelRedemption:(req_id)=>sb.from("redemption_requests").update({status:"cancelled"}).eq("id",req_id),
  cancelRedemptionByClient:(req_id)=>sb.from("redemption_requests").update({status:"cancelled"}).eq("id",req_id),
  createRedemption:(store_id,client_id,reward_id,reward_name,points_cost)=>sb.from("redemption_requests").insert({store_id,client_id,reward_id,reward_name,points_cost,status:"pending"}).select().single(),
  getClientPendingRedemptions:(client_id)=>sb.from("redemption_requests").select("*").eq("client_id",client_id).eq("status","pending").order("created_at",{ascending:false}),
};

function getLevel(pts, levels) {
  const lvls = Object.entries(levels||DEFAULT_SETTINGS.levels).sort((a,b)=>b[1].min-a[1].min);
  for(const [key,l] of lvls) { if(pts>=l.min) return key; }
  return "basico";
}
function getLevelInfo(levelKey, levels) {
  return (levels||DEFAULT_SETTINGS.levels)[levelKey] || DEFAULT_SETTINGS.levels.basico;
}
function getLevelBadge(levelKey, levels) {
  const l = getLevelInfo(levelKey, levels);
  const icons = {basico:"👤",vip1:"🥉",vip2:"🥈",vip3:"🏆"};
  return {icon:icons[levelKey]||"👤", ...l};
}

function PointsCelebration({pts,newPts,clientName,newLevel,prevLevel,settings,onClose}) {
  const [show,setShow]=useState(false);
  const levels=settings?.levels||DEFAULT_SETTINGS.levels;
  const levChanged=newLevel!==prevLevel;
  const levelInfo=getLevelInfo(newLevel,levels);
  const levelKeys=Object.keys(levels).sort((a,b)=>levels[a].min-levels[b].min);
  const nextKey=levelKeys[levelKeys.indexOf(newLevel)+1];
  const nextLevel=nextKey?levels[nextKey]:null;
  const pct=nextLevel?Math.min(100,Math.round(((newPts-levelInfo.min)/(nextLevel.min-levelInfo.min))*100)):100;
  useEffect(()=>{setTimeout(()=>setShow(true),60);},[]);
  return (
    <>
      <Confetti active={show}/>
      <div style={{position:"fixed",inset:0,background:"rgba(8,4,18,0.88)",zIndex:9980,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={onClose}>

          <div style={{width:76,height:76,borderRadius:"50%",background:`linear-gradient(135deg,${C.r500},${C.r300})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:34,margin:"0 auto 14px",animation:"bounce 0.5s 0.3s ease both",boxShadow:`0 8px 24px ${C.r400}55`}}>⭐</div>
          <div style={{fontSize:13,color:C.g600,marginBottom:4}}>Parabéns, {clientName.split(" ")[0]}!</div>
          <div style={{fontSize:50,fontWeight:800,color:C.r400,fontFamily:"Georgia,serif",lineHeight:1,animation:"countUp 0.4s 0.2s both"}}>+{fmtPts(pts)}</div>
          <div style={{fontSize:16,color:C.g700,fontWeight:600,marginBottom:18}}>pontos adicionados! 🎉</div>
          {levChanged&&(
            <div style={{background:`linear-gradient(135deg,${C.gold},${C.gold2})`,borderRadius:14,padding:"11px 16px",marginBottom:16,animation:"levelUp 0.5s 0.4s both"}}>
              <div style={{fontSize:22,marginBottom:3}}>{getLevelBadge(newLevel,levels).icon}</div>
              <div style={{fontWeight:800,fontSize:15,color:C.white}}>🆙 Subiu para {levelInfo.name}!</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.85)",marginTop:2}}>{levelInfo.benefits}</div>
            </div>
          )}
          <div style={{background:C.r50,borderRadius:12,padding:"10px 14px",marginBottom:16}}>
            <div style={{fontSize:10,color:C.g600,marginBottom:1,textTransform:"uppercase",letterSpacing:0.5}}>Saldo total</div>
            <div style={{fontSize:28,fontWeight:800,color:C.r500,fontFamily:"Georgia,serif"}}>{fmtPts(newPts)} <span style={{fontSize:13,fontWeight:500}}>pts</span></div>
          </div>
          {nextLevel&&(
            <div style={{marginBottom:18}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.g600,marginBottom:5}}>
                <span>→ {nextLevel.name}</span><span>{pct}%</span>
              </div>
              <div style={{background:C.g200,borderRadius:8,height:9,overflow:"hidden"}}>
                <div style={{width:`${pct}%`,height:"100%",background:`linear-gradient(90deg,${C.r400},${C.r300})`,borderRadius:8,transition:"width 1s ease 0.5s"}}/>
              </div>
              <div style={{fontSize:11,color:C.g400,marginTop:3}}>Faltam {fmtPts(nextLevel.min-newPts)} pts para {nextLevel.name}</div>
            </div>
          )}
          <button onClick={onClose} style={{width:"100%",padding:"12px",borderRadius:12,border:"none",background:`linear-gradient(135deg,${C.r500},${C.r400})`,color:C.white,fontSize:15,fontWeight:700,cursor:"pointer",boxShadow:`0 4px 14px ${C.r400}55`}}>
            Continuar ✨
          </button>
        </div>
      </div>
    </>
  );
}

  const [err,setErr]=useState(""); const [loading,setLoad]=useState(false);

  const submitOwner=async()=>{
    setErr("");setLoad(true);
    const {data,error}=mode==="login"?await api.signIn(email,pwd):await api.signUp(email,pwd);
    setLoad(false);
    if(error){setErr(error.message);return;}
    if(mode==="signup"&&!data.session){setErr("✅ Confirme seu e-mail para continuar!");return;}
    onAuth(data.session||data.user);
  };

  const submitAttendant=async()=>{
    if(!attUser||!attPwd){setErr("Preencha usuário e senha");return;}
    setErr("");setLoad(true);
    // Find store by slug or search all stores for this attendant
    const {data:stores}=await sb.from("stores").select("id,name,slug").order("name");
    if(!stores){setErr("Erro ao buscar lojas");setLoad(false);return;}
    let found=null;
    for(const st of stores){
      const {data:att}=await api.getAttendantByLogin(st.id,attUser.trim().toLowerCase(),attPwd);
      if(att){found={attendant:att,store:st};break;}
    }
    setLoad(false);
    if(!found){setErr("Usuário ou senha incorretos");return;}
    onAttendantAuth(found.attendant,found.store);
  };

  return (
    <div style={{minHeight:"100vh",background:C.r900,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>

            <>

  const slug=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const create=async()=>{
    if(!name.trim()){setErr("Nome da loja é obrigatório");return;}
    setLoad(true);
    const {data,error}=await api.createStore(user.id,name.trim(),slug||"loja-"+Date.now(),rawPhone(phone));
    setLoad(false);
    if(error){setErr(error.message);return;}
    onDone(data);
  };
  return (
    <div style={{minHeight:"100vh",background:C.r900,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:440,animation:"slideIn 0.4s ease"}}>
        <div style={{textAlign:"center",marginBottom:28}}><Logo size={44}/><h2 style={{color:C.white,fontFamily:"Georgia,serif",fontSize:22,margin:"12px 0 5px"}}>Bem-vindo! 🎉</h2><p style={{color:C.r200,fontSize:14}}>Configure sua loja para começar</p></div>
        <div style={{background:"rgba(255,255,255,0.04)",borderRadius:20,padding:26,border:"1px solid rgba(255,255,255,0.08)"}}>
          <Input label="Nome da loja *" value={name} onChange={e=>setName(e.target.value)} placeholder="Ex: Açaíteria da Ana" style={{background:"rgba(255,255,255,0.06)",border:"1.5px solid rgba(255,255,255,0.12)",color:C.white}}/>
          {name&&<div style={{marginTop:-9,marginBottom:11,fontSize:12,color:C.r200}}>🔗 /{slug}</div>}
          <Input label="WhatsApp da loja" type="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="11999887766" style={{background:"rgba(255,255,255,0.06)",border:"1.5px solid rgba(255,255,255,0.12)",color:C.white}}/>
          {err&&<div style={{marginBottom:12,padding:"9px 13px",borderRadius:9,background:"#fee2e220",color:C.red,fontSize:13}}>{err}</div>}
          <Btn full loading={loading} onClick={create}>Criar minha loja →</Btn>
        </div>
      </div>
    </div>
  );
}

function CampaignModal({clients,store,onClose,showToast,preset}) {
  const settings = store.settings||DEFAULT_SETTINGS;
  const [searchQ,setSearchQ]=useState("");
  const [sortCol,setSortCol]=useState(null);
  const [sortDir,setSortDir]=useState("desc");
  const [ptsFaixaFilter,setPtsFaixaFilter]=useState(null);
  const [visitFilter,setVisitFilter]=useState(null);
  const [selectedIds,setSelectedIds]=useState(preset&&preset.preSelected?new Set(preset.preSelected):new Set());
  const [filter,setFilter]=useState(preset&&preset.preSelected?"all":(preset&&preset.filter?preset.filter:"all"));
  const [msgType,setMsgType]=useState(preset&&preset.preSelected?"custom":(preset&&preset.msgType?preset.msgType:"points"));
  const [msg,setMsg]=useState(preset&&preset.msgType?(settings["msg_"+preset.msgType]||DEFAULT_SETTINGS["msg_"+preset.msgType]||settings.msg_points||DEFAULT_SETTINGS.msg_points):(settings.msg_points||DEFAULT_SETTINGS.msg_points));
  const [ageMin,setAgeMin]=useState(""); const [ageMax,setAgeMax]=useState("");
  const [inactiveDays,setInactiveDays]=useState(settings.inactive_days||30);
  const [birthMonthFilter,setBirthMonthFilter]=useState("");
  const [hourFilter,setHourFilter]=useState("");
  const [sending,setSending]=useState(false); const [sent,setSent]=useState(0);
  const [queue,setQueue]=useState(null);
  const [excludeContacted,setExcludeContacted]=useState(!(preset&&preset.preSelected));
  const contactDays=30;

  const months=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

  const hasEmoji = (s) => s && s.split("").some(c => c.codePointAt(0) > 127);
  const msgTemplates = {
    points:  (hasEmoji(settings.msg_points)  ? settings.msg_points  : null) || DEFAULT_SETTINGS.msg_points,
    birthday:(hasEmoji(settings.msg_birthday) ? settings.msg_birthday: null) || DEFAULT_SETTINGS.msg_birthday,
    inactive:(hasEmoji(settings.msg_inactive) ? settings.msg_inactive: null) || DEFAULT_SETTINGS.msg_inactive,
    complete:(hasEmoji(settings.msg_complete) ? settings.msg_complete: null) || DEFAULT_SETTINGS.msg_complete,
    ranking: (hasEmoji(settings.msg_ranking)  ? settings.msg_ranking : null) || DEFAULT_SETTINGS.msg_ranking,
    custom:  settings.msg_custom  || DEFAULT_SETTINGS.msg_custom,
  };

  const allFiltered = useMemo(()=>{
    let list=[...clients];
    if(filter==="birthday")    list=list.filter(c=>isBirthday(c.dob));
    if(filter==="inactive")    list=list.filter(c=>daysDiff(c.last_visit)>=(inactiveDays||30));
    if(filter==="vip")         list=list.filter(c=>c.level&&c.level!=="basico");
    if(filter==="incomplete")  list=list.filter(c=>!c.email||!c.dob);
    if(filter==="basico")      list=list.filter(c=>!c.level||c.level==="basico");
    if(filter==="age")         list=list.filter(c=>{const a=age(c.dob);return a!==null&&a>=(ageMin||0)&&a<=(ageMax||999);});
    if(filter==="birthmonth"&&birthMonthFilter!=="") list=list.filter(c=>birthMonth(c.dob)===Number(birthMonthFilter));
    if(filter==="hour"&&hourFilter!=="") list=list.filter(c=>{
      return hourOfDay(c.last_visit)===Number(hourFilter);
    });
    if(excludeContacted) list=list.filter(c=>{
      if(!c.last_contacted_at) return true;
      return daysDiff(c.last_contacted_at)<contactDays?false:true;
    });
    return list;
  },[clients,filter,inactiveDays,ageMin,ageMax,birthMonthFilter,hourFilter,excludeContacted]);

  const searchFiltered = useMemo(()=>{
    if(!searchQ) return allFiltered;
    return allFiltered.filter(c=>c.name.toLowerCase().includes(searchQ.toLowerCase())||c.phone.includes(searchQ));
  },[allFiltered,searchQ,excludeContacted]);

  const [preSelectedApplied,setPreSelectedApplied]=useState(false);
  useEffect(()=>{
    if(preset&&preset.preSelected&&!preSelectedApplied){setPreSelectedApplied(true);return;}
    setSelectedIds(new Set(allFiltered.map(c=>c.id)));
  },[filter,inactiveDays,ageMin,ageMax,birthMonthFilter,hourFilter,excludeContacted]);

  const toggleClient=(id)=>{
    setSelectedIds(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
  };
  const selectAll=()=>setSelectedIds(new Set(searchFiltered.map(c=>c.id)));
  const clearAll=()=>setSelectedIds(new Set());

  const buildMsg = (client) => {
    const level=getLevelBadge(client.level||"basico",settings.levels||DEFAULT_SETTINGS.levels);
    const sorted=[...clients].sort((a,b)=>b.points-a.points);
    const pos=sorted.findIndex(c=>c.id===client.id)+1;
    const leader=sorted[0];
    return (msg||"")
      .replace(/\{nome\}/g,client.name.split(" ")[0])
      .replace(/\{saldo\}/g,fmtPts(client.points))
      .replace(/\{pontos\}/g,fmtPts(client.points))
      .replace(/\{nivel\}/g,level.name)
      .replace(/\{link\}/g,magicLink(client.magic_token||""))
      .replace(/\{loja\}/g,getStoreName(store,settings))
      .replace(/\{dias\}/g,String(daysDiff(client.last_visit)))
      .replace(/\{brinde\}/g,settings.birthday_gift||"brinde especial")
      .replace(/\{posicao\}/g,String(pos))
      .replace(/\{falta\}/g,fmtPts(Math.max(0,(leader?.points||0)-client.points)))
      .replace(/\{bonus\}/g,String(settings.bonus_complete_points||50));
  };

  const selectedClients = clients.filter(c=>selectedIds.has(c.id));
  const previewClient = selectedClients[0]||clients[0];

  const sendAll = () => {
    if(!selectedClients.length){showToast("Selecione pelo menos um cliente","error");return;}
    if(!msg||!msg.trim()){showToast("Digite uma mensagem","error");return;}
    const list=selectedClients.map(c=>({...c,builtMsg:buildMsg(c)}));
    setQueue({list,index:0,done:0});
  };
  const queueNext = async() => {
    if(!queue) return;
    const sentClient=queue.list[queue.index];
    if(sentClient) await api.markContacted([sentClient.id]);
    const nextIndex=queue.index+1;
    if(nextIndex>=queue.list.length){
      showToast("✅ "+queue.list.length+" mensagens enviadas!");
      setQueue(null);
      onClose();
    } else {
      setQueue({...queue,index:nextIndex,done:nextIndex});
    }
  };
  const queueSkip = () => {
    if(!queue) return;
    const nextIndex=queue.index+1;
    if(nextIndex>=queue.list.length){
      showToast("✅ Envio concluído!");
      setQueue(null);
      onClose();
    } else {
      setQueue({...queue,index:nextIndex});
    }
  };

  return (
    <Modal title="📢 Campanha — Enviar mensagens" onClose={onClose} wide>
      <div className="campaign-grid" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
        
        <div>
          <div style={{fontSize:12,fontWeight:700,color:C.g700,marginBottom:8,textTransform:"uppercase",letterSpacing:0.5}}>1. Selecionar público</div>
          <Select value={filter} onChange={e=>{setFilter(e.target.value);setBirthMonthFilter("");setHourFilter("");}}>
            <option value="all">👥 Todos os clientes ({clients.length})</option>
            <option value="birthday">🎂 Aniversariantes de hoje</option>
            <option value="birthmonth">📅 Por mês de aniversário</option>
            <option value="inactive">😴 Inativos (X dias)</option>
            <option value="vip">⭐ Clientes VIP</option>
            <option value="incomplete">⚠️ Cadastros incompletos</option>
            <option value="basico">👤 Clientes Básicos</option>
            <option value="age">🎂 Por faixa etária</option>
            <option value="hour">⏰ Por horário de visita</option>
          </Select>

          {filter==="inactive"&&<Input label="Dias sem comprar" type="number" value={inactiveDays} onChange={e=>setInactiveDays(e.target.value)} placeholder="30"/>}
          {filter==="age"&&<div style={{display:"flex",gap:8}}><Input label="Idade mín." type="number" value={ageMin} onChange={e=>setAgeMin(e.target.value)} placeholder="18"/><Input label="Idade máx." type="number" value={ageMax} onChange={e=>setAgeMax(e.target.value)} placeholder="60"/></div>}
          {filter==="birthmonth"&&(
            <Select label="Mês de aniversário" value={birthMonthFilter} onChange={e=>setBirthMonthFilter(e.target.value)}>
              <option value="">Selecione o mês</option>
              {months.map((m,i)=><option key={i} value={i}>{m}</option>)}
            </Select>
          )}
          {filter==="hour"&&(
            <Select label="Horário de visita" value={hourFilter} onChange={e=>setHourFilter(e.target.value)}>
              <option value="">Selecione o horário</option>
              {Array.from({length:16},(_,i)=>i+8).map(h=><option key={h} value={h}>{String(h).padStart(2,"0")}:00 — {String(h+1).padStart(2,"0")}:00</option>)}
            </Select>
          )}

          <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",background:excludeContacted?"#f0fdf4":"#fafafa",borderRadius:10,border:`1px solid ${excludeContacted?"#86efac":"#e5e7eb"}`,marginTop:8,cursor:"pointer"}} onClick={()=>setExcludeContacted(p=>!p)}>
            <div style={{width:18,height:18,borderRadius:5,background:excludeContacted?"#16a34a":"#d1d5db",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              {excludeContacted&&<span style={{color:"#fff",fontSize:12,fontWeight:700}}>✓</span>}
            </div>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:excludeContacted?"#15803d":C.g700}}>🚫 Excluir contatados há menos de {contactDays} dias</div>
              <div style={{fontSize:11,color:C.g400}}>Evita spam e respeita o cliente</div>
            </div>
          </div>

          <input value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="🔍 Buscar por nome ou telefone..." style={{width:"100%",padding:"7px 10px",borderRadius:8,border:`1px solid ${C.g200}`,fontSize:13,marginBottom:8,marginTop:8,outline:"none"}}/>

          
          <div style={{display:"flex",gap:6,marginBottom:6}}>
            <button onClick={selectAll} style={{fontSize:11,padding:"4px 10px",borderRadius:7,border:`1px solid ${C.r300}`,background:C.r50,color:C.r500,cursor:"pointer",fontWeight:600}}>Selecionar todos</button>
            <button onClick={clearAll} style={{fontSize:11,padding:"4px 10px",borderRadius:7,border:`1px solid ${C.g200}`,background:C.white,color:C.g600,cursor:"pointer"}}>Limpar</button>
            <span style={{fontSize:11,color:C.g600,alignSelf:"center",marginLeft:"auto"}}><strong style={{color:C.r500}}>{selectedIds.size}</strong> selecionados</span>
          </div>

          
          <div style={{maxHeight:220,overflow:"auto",border:`1px solid ${C.g200}`,borderRadius:9}}>
            {searchFiltered.map(c=>{
              const sel=selectedIds.has(c.id);
              return (
                <div key={c.id} onClick={()=>toggleClient(c.id)} style={{padding:"8px 12px",display:"flex",alignItems:"center",gap:9,cursor:"pointer",borderBottom:`1px solid ${C.g100}`,background:sel?C.r50:"transparent",transition:"background 0.15s"}}>
                  <div style={{width:16,height:16,borderRadius:4,border:`2px solid ${sel?C.r400:C.g300}`,background:sel?C.r400:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                    {sel&&<span style={{color:C.white,fontSize:10}}>✓</span>}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,color:C.g900,fontWeight:sel?600:400,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</div>
                    <div style={{display:"flex",alignItems:"center",gap:4}}>
                      <span style={{fontSize:10,color:C.g400}}>{fmtPts(c.points)} pts</span>
                      {c.last_contacted_at&&daysDiff(c.last_contacted_at)<contactDays&&(
                        <span style={{fontSize:10,color:"#d97706",fontWeight:600,background:"#fef3c7",borderRadius:4,padding:"0px 4px"}}>📨 {daysDiff(c.last_contacted_at)}d</span>
                      )}
                    </div>
                  </div>
                  <LevelBadge levelKey={c.level||"basico"} levels={settings.levels}/>
                </div>
              );
            })}
            {searchFiltered.length===0&&<div style={{padding:20,textAlign:"center",color:C.g400,fontSize:13}}>Nenhum cliente encontrado</div>}
          </div>
        </div>

        
        <div>
          <div style={{fontSize:12,fontWeight:700,color:C.g700,marginBottom:8,textTransform:"uppercase",letterSpacing:0.5}}>2. Escolher mensagem</div>
          <Select value={msgType} onChange={e=>{setMsgType(e.target.value);setMsg(msgTemplates[e.target.value]||"");}}>
            <option value="points">⭐ Notificação de pontos</option>
            <option value="birthday">🎂 Feliz aniversário</option>
            <option value="inactive">😴 Chamar inativos</option>
            <option value="complete">⚠️ Completar cadastro</option>
            <option value="ranking">🏆 Posição no ranking</option>
            <option value="custom">✏️ Mensagem personalizada</option>
          </Select>
          <Textarea label="Mensagem (edite à vontade)" value={msg} onChange={e=>setMsg(e.target.value)} rows={7} placeholder="Digite a mensagem..."/>
          <div style={{padding:"8px 10px",background:C.r50,borderRadius:8,fontSize:11,color:C.r500,lineHeight:1.7,marginBottom:8}}>
            <strong>Variáveis:</strong> {"{nome}"} {"{saldo}"} {"{nivel}"} {"{link}"} {"{loja}"} {"{dias}"} {"{brinde}"} {"{posicao}"} {"{falta}"} {"{bonus}"} {"{bonus_avaliacao}"} {"{rate_link}"}
          </div>
          {previewClient&&msg&&(
            <WAPreview msg={buildMsg(previewClient)} storeName={getStoreName(store,settings)}/>
          )}
        </div>
      </div>

      <div style={{marginTop:20,display:"flex",gap:10,justifyContent:"flex-end",alignItems:"center",borderTop:`1px solid ${C.g100}`,paddingTop:16}}>
        <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
        <Btn disabled={selectedIds.size===0||!msg||!msg.trim()} onClick={sendAll}>
          📤 Iniciar envio para {selectedIds.size} cliente{selectedIds.size!==1?"s":""}
        </Btn>
      </div>
      {queue&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"#fff",borderRadius:20,padding:28,maxWidth:420,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div style={{fontWeight:700,fontSize:16,color:"#111"}}>📤 Enviando mensagens</div>
              <div style={{background:"#7c3aed",color:"#fff",borderRadius:20,padding:"3px 12px",fontSize:13,fontWeight:700}}>{queue.index+1} de {queue.list.length}</div>
            </div>
            <div style={{background:"#f5f3ff",borderRadius:12,padding:"14px 16px",marginBottom:16}}>
              <div style={{fontWeight:700,fontSize:15,color:"#111",marginBottom:4}}>👤 {queue.list[queue.index].name}</div>
              <div style={{fontSize:13,color:"#6b7280",marginBottom:10}}>📱 {fmtPhone(queue.list[queue.index].phone)}</div>
              <div style={{background:"#fff",borderRadius:9,padding:"10px 14px",fontSize:13,color:"#374151",whiteSpace:"pre-wrap",lineHeight:1.6,maxHeight:160,overflowY:"auto",border:"1px solid #e5e7eb"}}>
                {queue.list[queue.index].builtMsg}
              </div>
            </div>
            <div style={{display:"flex",gap:10,marginBottom:10}}>
              <Btn full variant="ghost" onClick={queueSkip}>⏭ Pular este</Btn>
              <Btn full onClick={()=>{window.open(waLink(queue.list[queue.index].phone,queue.list[queue.index].builtMsg),"_blank");queueNext();}}>
                Abrir WhatsApp →
              </Btn>
            </div>
            <div style={{display:"flex",gap:4,justifyContent:"center"}}>
              {queue.list.map((_,i)=>(
                <div key={i} style={{width:8,height:8,borderRadius:"50%",background:i<queue.index?"#7c3aed":i===queue.index?"#a78bfa":"#e5e7eb"}}/>
              ))}
            </div>
            <div style={{textAlign:"center",marginTop:8}}>
              <button onClick={()=>{setQueue(null);showToast("Envio cancelado");}} style={{background:"none",border:"none",color:"#9ca3af",fontSize:12,cursor:"pointer"}}>Cancelar envio</button>
            </div>
          </div>
        </div>
      )}
    </Modal>
  );
}

function RankingPanel({client,allClients,settings}) {
  const levels=settings?.levels||DEFAULT_SETTINGS.levels;
  const sorted=[...allClients].sort((a,b)=>b.points-a.points);
  const myPos=sorted.findIndex(c=>c.id===client.id)+1;
  const leader=sorted[0];
  const myLevel=getLevel(client.points,levels);
  const myInfo=getLevelInfo(myLevel,levels);
  const levelKeys=Object.keys(levels).sort((a,b)=>levels[a].min-levels[b].min);
  const nextLevelKey=levelKeys[levelKeys.indexOf(myLevel)+1];
  const nextLevel=nextLevelKey?levels[nextLevelKey]:null;
  const pctToNext=nextLevel?Math.min(100,Math.round(((client.points-myInfo.min)/(nextLevel.min-myInfo.min))*100)):100;
  return (
    <div style={{padding:"0 0 20px"}}>
      <div style={{background:`linear-gradient(135deg,${C.r800},${C.r600})`,borderRadius:18,padding:20,marginBottom:16,color:C.white,textAlign:"center"}}>
        <div style={{fontSize:12,color:C.r200,letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>Sua posição</div>
        <div style={{fontSize:52,fontWeight:700,fontFamily:"Georgia,serif",lineHeight:1}}>#{myPos}</div>
        <div style={{fontSize:13,color:C.r200,marginTop:4}}>de {allClients.length} clientes</div>
        <div style={{marginTop:12,padding:"6px 16px",background:"rgba(255,255,255,0.1)",borderRadius:20,display:"inline-block",fontSize:13,fontWeight:600}}>
          {getLevelBadge(myLevel,levels).icon} {myInfo.name}
        </div>
      </div>
      {nextLevel&&(
        <div style={{background:C.white,borderRadius:14,padding:16,marginBottom:14,border:`1px solid ${C.g100}`}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <span style={{fontSize:13,fontWeight:600,color:C.g900}}>🎯 Próximo nível: {nextLevel.name}</span>
            <span style={{fontSize:12,color:C.g600}}>{fmtPts(client.points)}/{fmtPts(nextLevel.min)}</span>
          </div>
          <div style={{background:C.g100,borderRadius:8,height:10,overflow:"hidden",marginBottom:8}}>
            <div style={{width:`${pctToNext}%`,height:"100%",background:`linear-gradient(90deg,${C.r400},${C.r300})`,borderRadius:8}}/>
          </div>
          <div style={{fontSize:12,color:C.r500}}>Faltam <strong>{fmtPts(nextLevel.min-client.points)}</strong> pts · {nextLevel.benefits}</div>
        </div>
      )}
      {leader&&leader.id!==client.id&&(
        <div style={{background:C.goldL,borderRadius:12,padding:"12px 16px",marginBottom:14,border:"1px solid #fcd34d"}}>
          <div style={{fontSize:12,fontWeight:600,color:"#92400e",marginBottom:2}}>🏆 Líder: {leader.name.split(" ")[0]}</div>
          <div style={{fontSize:13,color:"#78350f"}}>Faltam <strong>{fmtPts(leader.points-client.points)}</strong> pts para o 1º lugar</div>
        </div>
      )}
      <div style={{fontSize:13,fontWeight:700,color:C.g700,marginBottom:8}}>📊 Top 5 clientes</div>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {sorted.slice(0,5).map((c,i)=>{
          const isMe=c.id===client.id;
          const medals=["🥇","🥈","🥉","4️⃣","5️⃣"];
          return (
            <div key={c.id} style={{padding:"10px 14px",borderRadius:10,background:isMe?C.r50:C.white,border:`1px solid ${isMe?C.r300:C.g100}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{display:"flex",gap:10,alignItems:"center"}}>
                <span style={{fontSize:18}}>{medals[i]}</span>
                <span style={{fontSize:13,fontWeight:isMe?700:500,color:isMe?C.r500:C.g900}}>{isMe?`${c.name.split(" ")[0]} (você)`:c.name.split(" ")[0]}</span>
              </div>
              <span style={{fontWeight:700,color:isMe?C.r500:C.g700,fontSize:14}}>{fmtPts(c.points)} pts</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function AdminPanel({user,store,onSignOut,onStoreUpdate,isAttendant=false,currentAttendantProp=null}) {

  const [txs,setTxs]=useState([]);
  const [rewards,setRewards]=useState([]);
  const [loading,setLoading]=useState(true);
  const [toast,setToast]=useState(null);
  const [modal,setModal]=useState(null);
  const [redemptions,setRedemptions]=useState([]);

  const filteredTxs = useMemo(()=>{
    const now=new Date();
    let from=null, to=null;
    if(dateFilter==="today"){from=new Date(now.getFullYear(),now.getMonth(),now.getDate());to=new Date(from.getTime()+86400000);}
    else if(dateFilter==="week"){from=new Date(now-7*86400000);to=new Date();}
    else if(dateFilter==="month"){from=new Date(now.getFullYear(),now.getMonth(),1);to=new Date();}
    else if(dateFilter==="year"){from=new Date(now.getFullYear(),0,1);to=new Date();}
    else if(dateFilter==="custom"){from=dateFrom?new Date(dateFrom):null;to=dateTo?new Date(dateTo+"T23:59:59"):null;}
    return txs.filter(t=>{
      if(!from&&!to) return true;
      const d=new Date(t.created_at);
      if(from&&d<from) return false;
      if(to&&d>to) return false;
      return true;
    });

      const [min,max]=ptsFaixaFilter;
      list=list.filter(c=>(c.points||0)>=min&&(max===null||(c.points||0)<=max));
    }
    if(visitFilter){
      list=list.filter(c=>daysDiff(c.last_visit)>=visitFilter);
    }
    if(visitCountFilter!==null){

      list=list.filter(c=>{const v=c.total_visits||0;return v>=vMin&&(vMax===null||v<=vMax);});
    }
    if(sortCol){
      list=[...list].sort((a,b)=>{
        let va,vb;
        if(sortCol==="points"){va=a.points||0;vb=b.points||0;}
        else if(sortCol==="visits"){va=a.total_visits||0;vb=b.total_visits||0;}

        else{va=0;vb=0;}
        return sortDir==="desc"?vb-va:va-vb;
      });
    }

  function parseCSV(text){
    var lines=text.trim().split(/\r?\n/);
    if(!lines.length) return [];
    var header=lines[0].toLowerCase().split(/[;,\t]/);
    return lines.slice(1).map(function(line){
      var cols=line.split(/[;,\t]/);
      var obj={};
      header.forEach(function(h,i){ obj[h.trim()]=cols[i]?cols[i].trim():""; });
      return {name:obj.nome||obj.name||"",phone:obj.telefone||obj.phone||obj.celular||"",email:obj.email||"",dob:obj.nascimento||obj.dob||obj["data de nascimento"]||"",notes:obj.observacao||obj.notes||""};
    }).filter(function(r){ return r.name||r.phone; });
  }
  const handleImportCSV=async()=>{
    if(!importRows.length) return;
    setImporting(true);
    var ok=0,fail=0;
    for(var i=0;i<importRows.length;i++){
      var row=importRows[i];
      if(!row.name||!row.phone) continue;
      var phone=row.phone.replace(/\D/g,"");
      var exists=clients.find(c=>c.phone===phone);
      if(exists){fail++;continue;}
      var res=await api.addClient(store.id,row.name,phone,row.email||"",row.dob||"",row.notes||"");
      if(res.data) ok++;
      else fail++;
    }
    await load();
    setImporting(false);
    setImportModal(false);
    setImportRows([]);
    showToast("✅ "+ok+" importados, "+fail+" ignorados");
  };

        </div>
      </div>
    )}
    {hasMsgPreview&&(
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={()=>setMsgPreview(null)}>
        <div style={{background:C.white,borderRadius:20,padding:24,width:"100%",maxWidth:440}} onClick={e=>e.stopPropagation()}>
          <div style={{fontWeight:700,fontSize:16,color:C.g900,marginBottom:4}}>📱 Prévia da mensagem</div>
          <div style={{fontSize:12,color:C.g500,marginBottom:14}}>Para: {msgPreview&&msgPreview.name}</div>
          <div style={{background:"#f0fdf4",borderRadius:12,padding:16,fontSize:13,color:C.g800,whiteSpace:"pre-wrap",marginBottom:20,border:"1px solid #bbf7d0"}}>{msgPreview&&msgPreview.msg}</div>
          <div style={{display:"flex",gap:8}}>
            <Btn full variant="ghost" onClick={()=>setMsgPreview(null)}>Cancelar</Btn>
            <Btn full variant="green" onClick={()=>{window.open(waLink(msgPreview.phone,msgPreview.msg),"_blank");setMsgPreview(null);}}>Abrir WhatsApp ✅</Btn>
          </div>
        </div>
      </div>
    )}
    {hasImportModal&&(
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={()=>setImportModal(false)}>
        <div style={{background:C.white,borderRadius:20,padding:24,width:"100%",maxWidth:460}} onClick={e=>e.stopPropagation()}>
          <div style={{fontWeight:700,fontSize:17,color:C.g900,marginBottom:8}}>📥 Importar Clientes via CSV</div>
          <div style={{fontSize:12,color:C.g500,marginBottom:16}}>Colunas aceitas: nome, telefone, email, nascimento, observacao</div>
          <input type="file" accept=".csv,.txt" onChange={e=>{var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=ev=>{setImportRows(parseCSV(ev.target.result));};r.readAsText(f);}} style={{width:"100%",marginBottom:12,fontSize:13}}/>
          {importRows.length>=1&&(
            <div style={{background:"#f0fdf4",borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:13,color:C.greenD}}>
              ✅ {importRows.length} clientes encontrados para importar
            </div>
          )}
          <div style={{display:"flex",gap:8}}>
            <Btn full variant="ghost" onClick={()=>{setImportModal(false);setImportRows([]); }}>Cancelar</Btn>
            <Btn full variant="primary" onClick={handleImportCSV}>{importing?"Importando...":"Importar"}</Btn>
          </div>
        </div>
      </div>
    )}
    {hasEditReward&&(
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={()=>setEditReward(null)}>
        <div style={{background:C.white,borderRadius:20,padding:24,width:"100%",maxWidth:400}} onClick={e=>e.stopPropagation()}>
          <div style={{fontWeight:700,fontSize:17,color:C.g900,marginBottom:18}}>✏️ Editar Recompensa</div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:600,color:C.g600,marginBottom:4}}>Nome</div>
            <input value={editReward.name} onChange={e=>setEditReward(p=>({...p,name:e.target.value}))} style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid #e5e7eb",fontSize:14}}/>
          </div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:600,color:C.g600,marginBottom:4}}>Pontos necessários</div>
            <input type="number" value={editReward.points_cost} onChange={e=>setEditReward(p=>({...p,points_cost:e.target.value}))} style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid #e5e7eb",fontSize:14}}/>
          </div>
          <div style={{marginBottom:20}}>
            <div style={{fontSize:12,fontWeight:600,color:C.g600,marginBottom:4}}>Descrição (opcional)</div>
            <input value={editReward.description||""} onChange={e=>setEditReward(p=>({...p,description:e.target.value}))} style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid #e5e7eb",fontSize:14}}/>
          </div>
          <div style={{display:"flex",gap:8}}>
            <Btn full variant="ghost" onClick={()=>setEditReward(null)}>Cancelar</Btn>
            <Btn full variant="primary" onClick={handleSaveReward}>Salvar</Btn>
          </div>
        </div>
      </div>
    )}
    </div>

  );
}

function ClientPortal({token}) {
  const [client,setClient]=useState(null);
  const [allClients,setAllClients]=useState([]);
  const [rewards,setRewards]=useState([]);
  const [txs,setTxs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [notFound,setNotFound]=useState(false);
  const [msg,setMsg]=useState(null);
  const [tab,setTab]=useState("home");
  const [completeForm,setCompleteForm]=useState({email:"",dob:""});
  const [completing,setCompleting]=useState(false);
  const [profileForm,setProfileForm]=useState(null);
  const [savingProfile,setSavingProfile]=useState(false);
  const [showCelebration,setShowCelebration]=useState(false);
  const [celebData,setCelebData]=useState(null);
  const [pendingRedemptions,setPendingRedemptions]=useState([]);

  useEffect(()=>{
    (async()=>{
      const {data:c}=await api.clientByToken(token);
      if(!c){setNotFound(true);setLoading(false);return;}
      const sid=c.store_id||c.stores?.id;
      const [r,t,all,pr]=await Promise.all([api.listRewards(sid),api.listClientTx(c.id),api.listClients(sid),api.getClientPendingRedemptions(c.id)]);
      if(c.blocked){setNotFound(true);setLoading(false);return;}
      setClient(c);
      setRewards((r.data||[]).filter(rr=>rr.active));
      setTxs(t.data||[]);
      setAllClients(all.data||[]);
      setPendingRedemptions(pr.data||[]);
      setLoading(false);
      const lastTx=(t.data||[]).find(tx=>tx.type==="earn");
      if(lastTx){
        const minsAgo=(Date.now()-new Date(lastTx.created_at).getTime())/60000;
        const celebKey="roxo_celebrated_"+lastTx.id;
        const alreadyCelebrated=localStorage.getItem(celebKey);
        if(minsAgo<10&&!alreadyCelebrated){
          localStorage.setItem(celebKey,"1");
          const settings=c.stores?.settings||DEFAULT_SETTINGS;
          const newLevel=getLevel(c.points,settings.levels||DEFAULT_SETTINGS.levels);
          setCelebData({pts:lastTx.points,newPts:c.points,clientName:c.name,newLevel,prevLevel:newLevel,settings});
          setShowCelebration(true);
        }
      }
    })();
  },[token]);

  const [redeemingId,setRedeemingId]=useState(null);
  const handleRedeem=async(reward)=>{
    if(!client) return;
    if(redeemingId) return; // soft lock — evita duplo clique
    if(client.points<reward.points_cost){setMsg({type:"error",text:"Pontos insuficientes 😔"});return;}
    const sid=client.store_id||client.stores?.id;
    const already=pendingRedemptions.find(function(r){return r.reward_id===reward.id;});
    if(already){setMsg({type:"error",text:"Você já tem uma solicitação pendente para esta recompensa."});return;}
    setRedeemingId(reward.id);
    const res=await api.createRedemption(sid,client.id,reward.id,reward.name,reward.points_cost);
    setRedeemingId(null);
    if(res.error){setMsg({type:"error",text:res.error.message});return;}
    setPendingRedemptions(function(p){return p.concat([res.data]);});
    setMsg({type:"success",text:"⏳ Solicitação enviada! Aguarde a confirmação do atendente."});
    setTimeout(function(){setMsg(null);},6000);
  };

  const [cancellingId,setCancellingId]=useState(null);
  const handleCancelMyRedemption=async(req)=>{
    if(cancellingId) return;
    if(!window.confirm('Cancelar esta solicitação de resgate?')) return;
    setCancellingId(req.id);
    await api.cancelRedemptionByClient(req.id);
    setCancellingId(null);
    setPendingRedemptions(p=>p.filter(r=>r.id!==req.id));
    setMsg({type:"success",text:"Solicitação cancelada."});
    setTimeout(()=>setMsg(null),3000);
  };
  const handleSaveProfile=async()=>{
    if(!profileForm) return;
    setSavingProfile(true);
    const updates={};
    if(profileForm.name&&profileForm.name.trim()) updates.name=profileForm.name.trim();
    if(profileForm.email!==undefined) updates.email=profileForm.email||null;
    // garantir que dob só vai pro banco se for ISO válido (8 dígitos)
    if(profileForm.dobMask&&profileForm.dobMask.replace(/\D/g,"").length===8){
      updates.dob=dobMaskToISO(profileForm.dobMask);
    } else if(profileForm.dob&&profileForm.dob.length===10){
      updates.dob=profileForm.dob;
    }
    if(profileForm.notes!==undefined) updates.notes=profileForm.notes||null;
    console.log("Salvando perfil:", updates);
    const {data:saved,error}=await api.updateClient(client.id,updates);
    console.log("Resultado save:", saved, error);
    if(error){
      setMsg({type:"error",text:"Erro ao salvar: "+error.message+" (código: "+error.code+")"});
      setSavingProfile(false);
      return;
    }
    if(!saved){
      setMsg({type:"error",text:"Não foi possível salvar. Verifique sua conexão e tente novamente."});
      setSavingProfile(false);
      return;
    }
    // Verificar no BANCO se bônus já foi dado — evita duplicidade ao recarregar
    const {data:fresh}=await sb.from("clients").select("profile_completed,email,dob").eq("id",client.id).maybeSingle();
    const nowEmail=updates.email!==undefined?updates.email:fresh?.email||client.email;
    const nowDob=updates.dob!==undefined?updates.dob:fresh?.dob||client.dob;
    if(nowEmail&&nowDob&&!fresh?.profile_completed){
      const sid=client.store_id||client.stores?.id;
      const bonusPts2=(client.stores?.settings?.bonus_complete_points)||50;
      await api.addBonusPoints(sid,client.id,bonusPts2,"Bônus cadastro completo");
      await api.updateClient(client.id,{profile_completed:true});
      setClient(prev=>({...prev,...updates,points:prev.points+bonusPts2,profile_completed:true}));
      setMsg({type:"success",text:"🎉 Perfil completo! Você ganhou "+bonusPts2+" pontos de bônus!"});
    } else {
      setClient(prev=>({...prev,...updates,...(fresh?.profile_completed?{profile_completed:true}:{})}));
      setMsg({type:"success",text:"✅ Perfil atualizado com sucesso!"});
    }
    setProfileForm(null);
    setSavingProfile(false);
    setTimeout(()=>setMsg(null),5000);
  };
  const handleComplete=async()=>{
    if(!completeForm.dob&&!completeForm.email){setMsg({type:"error",text:"Preencha pelo menos um campo"});return;}
    setCompleting(true);
    // Verificar no banco (não só no estado) se bônus já foi dado — evita duplicidade
    const {data:fresh}=await sb.from("clients").select("profile_completed,email,dob").eq("id",client.id).maybeSingle();
    if(fresh?.profile_completed){
      setClient(prev=>({...prev,profile_completed:true}));
      setCompleting(false);
      setMsg({type:"info",text:"Cadastro já foi completado anteriormente."});
      setTimeout(()=>setMsg(null),4000);
      return;
    }
    const updates={};
    if(completeForm.email) updates.email=completeForm.email;
    if(completeForm.dob)   updates.dob=completeForm.dob;
    await api.updateClient(client.id,updates);
    const nowEmail=completeForm.email||fresh?.email||client.email;
    const nowDob=completeForm.dob||fresh?.dob||client.dob;
    if(nowEmail&&nowDob){
      const sid=client.store_id||client.stores?.id;
      const bonusPts=(client.stores?.settings?.bonus_complete_points)||50;
      await api.addBonusPoints(sid,client.id,bonusPts,"Bônus cadastro completo");
      await api.updateClient(client.id,{profile_completed:true});
      setClient(prev=>({...prev,...updates,points:prev.points+bonusPts,profile_completed:true}));
      setCompleting(false);
      setMsg({type:"success",text:"🎉 Cadastro completo! Você ganhou "+bonusPts+" pontos de bônus!"});
    } else {
      setClient(prev=>({...prev,...updates}));
      setCompleting(false);
      setMsg({type:"success",text:"✅ Dados salvos! Complete e-mail e data de nascimento para ganhar o bônus."});
    }
    setCompleteForm({email:"",dob:"",dobMask:""});
    setTimeout(()=>setMsg(null),5000);
  };

  if(loading) return <div style={{minHeight:"100vh",background:C.r900,display:"flex",alignItems:"center",justifyContent:"center"}}><Spinner/></div>;
  if(notFound) return (
    <div style={{minHeight:"100vh",background:C.r900,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,gap:16}}>
      <Logo size={48}/>
      <div style={{color:C.r200,textAlign:"center",fontSize:15,lineHeight:1.7}}>Link inválido ou expirado.<br/>Peça ao atendente seu link pessoal.</div>
    </div>
  );

  const settings=client.stores?.settings||DEFAULT_SETTINGS;
  const levels=settings.levels||DEFAULT_SETTINGS.levels;
  const myLevel=getLevel(client.points,levels);
  const myInfo=getLevelInfo(myLevel,levels);
  const levelKeys=Object.keys(levels).sort((a,b)=>levels[a].min-levels[b].min);
  const nextLevelKey=levelKeys[levelKeys.indexOf(myLevel)+1];
  const nextLevel=nextLevelKey?levels[nextLevelKey]:null;
  const pctToNext=nextLevel?Math.min(100,Math.round(((client.points-myInfo.min)/(nextLevel.min-myInfo.min))*100)):100;
  const storeName=client.stores?.name||"RoxoClub";
  const isIncomplete=!client.email||!client.dob;
  const bonusPts=settings.bonus_complete_points||50;

  const clientTabs=[
    {id:"home",   icon:"🏠",label:"Início"},
    {id:"rewards",icon:"🎁",label:"Resgatar"},
    {id:"ranking",icon:"🏆",label:"Ranking"},
    {id:"history",icon:"📋",label:"Histórico"},
    {id:"profile",icon:"👤",label:"Perfil"},
  ];

  return (
    <div style={{minHeight:"100vh",background:C.r900,fontFamily:"'Segoe UI',system-ui,sans-serif",maxWidth:480,margin:"0 auto"}}>
      {showCelebration&&celebData&&(
        <PointsCelebration {...celebData} onClose={()=>setShowCelebration(false)}/>
      )}
      
      <div style={{background:`linear-gradient(160deg,${C.r800},${C.r900})`,padding:"24px 20px 0"}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:18}}><Logo size={28}/></div>
        <div style={{background:"rgba(255,255,255,0.05)",borderRadius:20,padding:20,border:"1px solid rgba(255,255,255,0.08)"}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:18}}>
            <div style={{position:"relative",flexShrink:0,cursor:"pointer"}} onClick={()=>setTab("profile")}>
              <div style={{width:52,height:52,borderRadius:"50%",background:`linear-gradient(135deg,${C.r400},${C.r200})`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:22,color:C.white,border:isIncomplete?"3px solid #fbbf24":"3px solid rgba(255,255,255,0.2)"}}>
                {(client.name||"?")[0].toUpperCase()}
              </div>
              {isIncomplete&&<div style={{position:"absolute",top:-2,right:-2,width:16,height:16,borderRadius:"50%",background:"#f59e0b",border:"2px solid #1e1b4b",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:"#fff",fontWeight:700}}>!</div>}
            </div>
            <div>
              <div style={{color:C.r200,fontSize:11,marginBottom:1}}>Olá 👋 — {storeName}</div>
              <div style={{color:C.white,fontWeight:700,fontSize:18,fontFamily:"Georgia,serif"}}>{client.name.split(" ")[0]}</div>
              <LevelBadge levelKey={myLevel} levels={levels}/>
            </div>
          </div>
          <div style={{textAlign:"center",marginBottom:18}}>
            <div style={{color:C.r200,fontSize:10,letterSpacing:2,textTransform:"uppercase",marginBottom:3}}>Seus pontos</div>
            <div style={{color:C.white,fontSize:56,fontWeight:700,lineHeight:1,fontFamily:"Georgia,serif"}}>{fmtPts(client.points)}</div>
            <div style={{color:C.r300,fontSize:12,marginTop:3}}>pontos disponíveis</div>
          </div>
          {nextLevel?(
            <div>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                <span style={{color:C.r300,fontSize:11}}>→ {nextLevel.name}</span>
                <span style={{color:C.r200,fontSize:11}}>{pctToNext}%</span>
              </div>
              <div style={{background:"rgba(255,255,255,0.08)",borderRadius:8,height:7,overflow:"hidden"}}>
                <div style={{width:`${pctToNext}%`,height:"100%",background:`linear-gradient(90deg,${C.r400},${C.r200})`,borderRadius:8,transition:"width 1.2s ease"}}/>
              </div>
              <div style={{fontSize:11,color:C.r300,marginTop:4}}>Faltam {fmtPts(nextLevel.min-client.points)} pts</div>
            </div>
          ):(
            <div style={{textAlign:"center",padding:"7px 12px",background:"rgba(245,158,11,0.15)",borderRadius:9,color:C.gold,fontSize:13,fontWeight:600}}>🏆 Nível máximo! Você é incrível!</div>
          )}
        </div>
      </div>

      
      <div style={{display:"flex",background:"rgba(255,255,255,0.04)",borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
        {clientTabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"10px 0",background:"transparent",border:"none",borderBottom:tab===t.id?`2px solid ${C.r300}`:"2px solid transparent",color:tab===t.id?C.r200:"rgba(255,255,255,0.35)",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <span style={{fontSize:18}}>{t.icon}</span>
            <span style={{fontSize:10,fontWeight:tab===t.id?700:400}}>{t.label}</span>
          </button>
        ))}
      </div>

      
      <div style={{background:C.r50,minHeight:"60vh",padding:"20px 16px"}}>
        {msg&&<div style={{padding:"12px 15px",borderRadius:11,marginBottom:14,background:msg.type==="success"?"#d1fae5":"#fee2e2",color:msg.type==="success"?C.greenD:C.red,fontWeight:500,fontSize:14,animation:"fadeUp 0.3s ease"}}>{msg.text}</div>}

        
        {isIncomplete&&tab==="home"&&(
          <div onClick={()=>setTab("profile")} style={{background:"#fffbeb",borderRadius:14,padding:"12px 16px",marginBottom:16,border:"1px solid #fcd34d",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}>
            <span style={{fontSize:24,flexShrink:0}}>⚠️</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,color:"#92400e",fontSize:13}}>Cadastro incompleto</div>
              <div style={{fontSize:12,color:"#78350f",marginTop:2}}>Acesse o <strong>Perfil</strong> e ganhe {bonusPts} pts de bônus ao completar!</div>
            </div>
            <span style={{color:"#92400e",fontSize:18,flexShrink:0}}>→</span>
          </div>
        )}

        {tab==="home"&&(
          <div>
            {pendingRedemptions.length>=1&&(
              <div style={{background:"#fef9c3",borderRadius:14,padding:16,marginBottom:16,border:"1px solid #fde68a"}}>
                <div style={{fontWeight:700,fontSize:14,color:"#92400e",marginBottom:10}}>⏳ Resgates Aguardando Aprovação</div>
                {pendingRedemptions.map(req=>(
                  <div key={req.id} style={{background:C.white,borderRadius:10,padding:"10px 14px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontWeight:600,fontSize:13,color:C.g900}}>🎁 {req.reward_name}</div>
                      <div style={{fontSize:11,color:C.g500,marginTop:2}}>{fmtDate(req.created_at)}</div>
                    </div>
                    <button onClick={()=>handleCancelMyRedemption(req)} disabled={cancellingId===req.id} style={{padding:"5px 10px",borderRadius:8,border:"1px solid #e5e7eb",background:"transparent",color:cancellingId===req.id?"#9ca3af":C.g500,fontSize:12,cursor:cancellingId===req.id?"not-allowed":"pointer"}}>{cancellingId===req.id?"Cancelando...":"Cancelar"}</button>
                  </div>
                ))}
              </div>
            )}
            <div style={{fontWeight:700,color:C.g900,marginBottom:10,fontSize:15}}>🎁 Recompensas em destaque</div>
            {rewards.slice(0,3).map(r=>{
              const can=client.points>=r.points_cost;
              return (
                <div key={r.id} style={{background:C.white,borderRadius:13,padding:"13px 15px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,border:`1px solid ${can?"#e9d5ff":C.g100}`,opacity:can?1:0.7}}>
                  <div style={{display:"flex",gap:11,alignItems:"center"}}>
                    <span style={{fontSize:26}}>{r.type==="product"?"💜":"💸"}</span>
                    <div><div style={{fontWeight:700,fontSize:13,color:C.g900}}>{r.name}</div><div style={{color:C.r500,fontWeight:600,fontSize:12}}>{fmtPts(r.points_cost)} pts</div></div>
                  </div>
                  <button onClick={()=>handleRedeem(r)} disabled={!can||redeemingId===r.id} style={{padding:"7px 13px",borderRadius:9,border:"none",background:can&&!redeemingId?C.r400:C.g200,color:can&&!redeemingId?C.white:C.g600,fontWeight:600,fontSize:12,cursor:can&&!redeemingId?"pointer":"not-allowed"}}>
                    {can?"Resgatar":"Insuf."}
                  </button>
                </div>
              );
            })}
            {rewards.length>3&&<div onClick={()=>setTab("rewards")} style={{textAlign:"center",fontSize:13,color:C.r500,cursor:"pointer",padding:8,fontWeight:600}}>Ver todas →</div>}

            <div style={{fontWeight:700,color:C.g900,marginBottom:8,marginTop:18,fontSize:15}}>📋 Últimas atividades</div>
            {txs.slice(0,5).map(t=>(
              <div key={t.id} style={{background:C.white,borderRadius:11,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7,border:`1px solid ${C.g100}`}}>
                <div>
                  <div style={{fontWeight:600,fontSize:13,color:C.g900}}>{t.note||"Atividade"}</div>
                  <div style={{fontSize:11,color:C.g400}}>{fmtDateTime(t.created_at)}</div>
                </div>
                <span style={{fontWeight:700,color:t.type==="earn"?C.green:C.red,fontSize:13}}>{t.type==="earn"?"+":""}{t.points} pts</span>
              </div>
            ))}
          </div>
        )}

        {tab==="rewards"&&(
          <div>
            <div style={{fontWeight:700,color:C.g900,marginBottom:12,fontSize:15}}>🎁 Todas as recompensas</div>
            {rewards.length===0&&<div style={{color:C.g400,textAlign:"center",padding:24}}>Nenhuma recompensa disponível</div>}
            {rewards.map(r=>{
              const can=client.points>=r.points_cost;
              const pct=Math.min(100,Math.round((client.points/r.points_cost)*100));
              return (

    setSaving(storeId);

    expires.setDate(expires.getDate()+days);

          </div>
        </div>

  return (

function isPlanActive(store) {
  if(!store) return false;
  if(store.plan_status==="superadmin") return true;
  if(!store.expires_at) return true;
  return new Date(store.expires_at).getTime() > Date.now();
}

function RatingPage({token}) {
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [stars,setStars]=useState(0);
  const [hover,setHover]=useState(0);
  const [comment,setComment]=useState("");
  const [done,setDone]=useState(false);
  const [saving,setSaving]=useState(false);

  useEffect(()=>{
    api.getRatingByToken(token).then(({data:d})=>{
      setData(d);setLoading(false);
      if(d?.stars>=1) setDone(true);
    });
  },[token]);

  const [bonusEarned,setBonusEarned]=useState(0);
  const [redirecting,setRedirecting]=useState(false);
  const [countdown,setCountdown]=useState(3);
  const submit=async()=>{
    if(!stars){return;}
    setSaving(true);
    await api.submitRating(data.id,stars,comment.trim()||null);
    // Grant bonus points for rating
    const storeSettings=data.stores?.settings||{};
    const bonusPts=storeSettings.bonus_rating_points||10;
    if(data.client_id&&data.store_id&&bonusPts>=1){
      await api.addBonusPoints(data.store_id,data.client_id,bonusPts,"Bônus por avaliar atendimento ⭐");
      setBonusEarned(bonusPts);
    }
    setSaving(false);setDone(true);
    // Redirecionar para portal do cliente após 3 segundos
    const magicTok=data.clients?.magic_token;
    if(magicTok){
      setRedirecting(true);
      var c=3;setCountdown(3);
      var iv=setInterval(()=>{
        c--;setCountdown(c);
        if(c<=0){clearInterval(iv);window.location.href=APP_URL+"/?token="+magicTok;}
      },1000);
    }
  };

  if(loading) return <div style={{minHeight:"100vh",background:"#0d0a1a",display:"flex",alignItems:"center",justifyContent:"center"}}><Spinner/></div>;
  if(!data) return <div style={{minHeight:"100vh",background:"#0d0a1a",display:"flex",alignItems:"center",justifyContent:"center",color:"#9ca3af",fontSize:15}}>Link de avaliação inválido ou expirado.</div>;

  const storeName=data.stores?.name||"a loja";
  const attendantName=data.attendants?.name||"o atendente";

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0d0a1a,#1a0b3b)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#fff",borderRadius:24,padding:32,maxWidth:380,width:"100%",boxShadow:"0 24px 64px rgba(0,0,0,0.4)",textAlign:"center"}}>
        <div style={{fontSize:40,marginBottom:8}}>⭐</div>
        <div style={{fontWeight:800,fontSize:20,color:"#111",marginBottom:6}}>Como foi seu atendimento?</div>
        <div style={{fontSize:14,color:"#6b7280",marginBottom:24}}>
          {done?"Obrigado pela sua avaliação! 💜":<>Atendido por <strong>{attendantName}</strong> em <strong>{storeName}</strong></>}
        </div>
        {done?(
          <>
            <div style={{fontSize:48,marginBottom:8}}>{stars>=4?"😊":stars===3?"😐":"😞"}</div>
            <div style={{fontSize:32,color:"#d97706",marginBottom:8}}>{"★".repeat(stars)}{"☆".repeat(5-stars)}</div>
            <div style={{fontSize:15,color:"#374151",fontWeight:600}}>Avaliação registrada!</div>
            {bonusEarned>=1&&(
              <div style={{background:"#ede9fe",borderRadius:12,padding:"10px 16px",marginTop:12,display:"flex",alignItems:"center",gap:8,justifyContent:"center"}}>
                <span style={{fontSize:20}}>🎁</span>
                <div>
                  <div style={{fontWeight:700,color:"#6d28d9",fontSize:14}}>+{bonusEarned} pontos de bônus!</div>
                  <div style={{fontSize:12,color:"#7c3aed"}}>Obrigado por avaliar seu atendimento 💜</div>
                </div>
              </div>
            )}
            <div style={{fontSize:13,color:"#9ca3af",marginTop:8}}>Sua opinião ajuda a melhorar o atendimento.</div>
            {redirecting&&(
              <div style={{marginTop:16,background:"#f0fdf4",borderRadius:12,padding:"12px 16px",border:"1px solid #bbf7d0"}}>
                <div style={{fontSize:13,color:"#16a34a",fontWeight:600}}>
                  Redirecionando para seus pontos em {countdown}s... 💜
                </div>
                <div style={{width:"100%",height:4,background:"#dcfce7",borderRadius:4,marginTop:8,overflow:"hidden"}}>
                  <div style={{height:"100%",background:"#16a34a",borderRadius:4,transition:"width 1s linear",width:(countdown/3*100)+"%"}}></div>
                </div>
              </div>
            )}
          </>
        ):(
          <>
            <div style={{display:"flex",justifyContent:"center",gap:8,marginBottom:20}}>
              {[1,2,3,4,5].map(s=>(
                <button key={s} onMouseEnter={()=>setHover(s)} onMouseLeave={()=>setHover(0)} onClick={()=>setStars(s)}
                  style={{fontSize:36,background:"none",border:"none",cursor:"pointer",transition:"transform 0.15s",transform:(hover||stars)>=s?"scale(1.2)":"scale(1)",color:(hover||stars)>=s?"#d97706":"#d1d5db"}}>★</button>
              ))}
            </div>
            {stars>=1&&(
              <div style={{marginBottom:16}}>
                <div style={{fontSize:22,marginBottom:4}}>{stars>=4?"😊 Ótimo!":stars===3?"😐 Regular":stars<=2?"😞 Precisa melhorar":""}</div>
                <textarea placeholder="Deixe um comentário (opcional)" value={comment} onChange={e=>setComment(e.target.value)}
                  style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid #e5e7eb",fontSize:14,resize:"none",height:80,boxSizing:"border-box",fontFamily:"inherit"}}/>
              </div>
            )}
            <Btn full variant="purple" onClick={submit} disabled={!stars||saving}>{saving?"Enviando...":"Enviar avaliação ⭐"}</Btn>
          </>
        )}
        <div style={{marginTop:20,fontSize:11,color:"#9ca3af"}}>Powered by 💜 RoxoClub</div>
      </div>
    </div>
  );
}


function AttendantPanel({attendant,storeData,onSignOut}) {
  const [fullStore,setFullStore]=useState(null);
  const [loading,setLoading]=useState(true);
  const [mustChange,setMustChange]=useState(attendant.must_change_password===true);
  const [newPwd,setNewPwd]=useState("");
  const [newPwd2,setNewPwd2]=useState("");
  const [pwdErr,setPwdErr]=useState("");
  const [saving,setSaving]=useState(false);

  useEffect(()=>{
    sb.from("stores").select("*").eq("id",storeData.id).maybeSingle().then(({data})=>{
      setFullStore(data||storeData);
      setLoading(false);
    });
  },[storeData.id]);

  const handleChangePassword=async()=>{
    if(newPwd.length<6){setPwdErr("Mínimo 6 caracteres");return;}
    if(!/[0-9]/.test(newPwd)){setPwdErr("A senha deve ter pelo menos 1 número");return;}
    if(newPwd!==newPwd2){setPwdErr("As senhas não coincidem");return;}
    setSaving(true);
    await api.updateAttendant(attendant.id,{password:newPwd,must_change_password:false});
    setSaving(false);
    setMustChange(false);
  };

  if(loading) return <div style={{minHeight:"100vh",background:"#f9fafb",display:"flex",alignItems:"center",justifyContent:"center"}}><Spinner/></div>;

  if(mustChange) return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0d0a1a,#1a0b3b)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#fff",borderRadius:24,padding:32,maxWidth:380,width:"100%",boxShadow:"0 24px 64px rgba(0,0,0,0.4)"}}>
        <div style={{textAlign:"center",marginBottom:20}}>
          <div style={{fontSize:40,marginBottom:8}}>🔐</div>
          <div style={{fontWeight:800,fontSize:20,color:"#111",marginBottom:6}}>Crie sua senha</div>
          <div style={{fontSize:14,color:"#6b7280"}}>Por segurança, você precisa criar uma senha pessoal antes de continuar.</div>
        </div>
        {pwdErr&&<div style={{background:"#fee2e2",color:"#991b1b",borderRadius:8,padding:"8px 12px",fontSize:13,marginBottom:12}}>{pwdErr}</div>}
        <div style={{marginBottom:8}}>
          <div style={{fontSize:12,color:"#6b7280",marginBottom:4,fontWeight:600}}>Nova senha</div>
          <input type="password" value={newPwd} onChange={e=>{setNewPwd(e.target.value);setPwdErr("");}}
            placeholder="Mínimo 6 caracteres, com números"
            style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid #e5e7eb",fontSize:15,boxSizing:"border-box"}}/>
        </div>
        <div style={{marginBottom:20}}>
          <div style={{fontSize:12,color:"#6b7280",marginBottom:4,fontWeight:600}}>Confirmar senha</div>
          <input type="password" value={newPwd2} onChange={e=>{setNewPwd2(e.target.value);setPwdErr("");}}
            placeholder="Digite novamente"
            style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid #e5e7eb",fontSize:15,boxSizing:"border-box"}}/>
        </div>
        <div style={{fontSize:11,color:"#9ca3af",marginBottom:16,background:"#f9fafb",borderRadius:8,padding:"8px 12px"}}>
          ✅ Mínimo 6 caracteres<br/>✅ Pelo menos 1 número<br/>✅ Não compartilhe sua senha com ninguém
        </div>
        <Btn full variant="purple" onClick={handleChangePassword} loading={saving}>
          {saving?"Salvando...":"Criar minha senha e entrar"}
        </Btn>
      </div>
    </div>
  );

  return <AdminPanel
    user={{email:"__attendant__", displayName:attendant.name}}
    store={fullStore}
    onSignOut={onSignOut}
    onStoreUpdate={()=>{}}
    isAttendant={true}
    currentAttendantProp={attendant}
  />;
}

function SelfRegisterPage({storeId}) {
  const [store,setStore]=useState(null);
  const [loading,setLoading]=useState(true);
  const [form,setForm]=useState({name:"",phone:""});
  const [phoneMask,setPhoneMask]=useState("");
  const [saving,setSaving]=useState(false);
  const [done,setDone]=useState(false);
  const [client,setClient]=useState(null);
  const [err,setErr]=useState("");

  useEffect(()=>{
    sb.from("stores").select("id,name,settings,slug").eq("id",storeId).maybeSingle().then(({data})=>{
      setStore(data);setLoading(false);
    });
  },[storeId]);

  const handlePhone=(v)=>{
    var d=v.replace(/\D/g,"").slice(0,11);
    var m=d.length<=10
      ?(d.length>6?"("+d.slice(0,2)+") "+d.slice(2,6)+"-"+d.slice(6)
        :d.length>2?"("+d.slice(0,2)+") "+d.slice(2)
        :d.length>0?"("+d:"")
      :"("+d.slice(0,2)+") "+d.slice(2,7)+"-"+d.slice(7);
    setPhoneMask(m);
    setForm(p=>({...p,phone:d}));
  };

  const handleSubmit=async()=>{
    if(!form.name.trim()||form.phone.length<10){setErr("Preencha nome e WhatsApp completo");return;}
    setSaving(true);setErr("");
    // Check if client already exists
    const {data:existing}=await sb.from("clients").select("*,stores(name,slug,settings,phone)").eq("store_id",storeId).eq("phone",form.phone).maybeSingle();
    if(existing){
      setClient(existing);setDone(true);setSaving(false);return;
    }
    // Generate magic token
    const tok=Math.random().toString(36).slice(2)+Date.now().toString(36);
    const {data:newClient,error}=await sb.from("clients").insert({
      store_id:storeId,
      name:form.name.trim(),
      phone:form.phone,
      magic_token:tok,
      source:"autocadastro",
    }).select("*,stores(name,slug,settings,phone)").maybeSingle();
    if(error){setErr("Erro ao cadastrar. Tente novamente.");setSaving(false);return;}
    setClient(newClient);setDone(true);setSaving(false);
  };

  if(loading) return <div style={{minHeight:"100vh",background:"#0d0521",display:"flex",alignItems:"center",justifyContent:"center"}}><Spinner/></div>;
  if(!store) return <div style={{minHeight:"100vh",background:"#0d0521",display:"flex",alignItems:"center",justifyContent:"center",color:"#9ca3af",fontSize:15,textAlign:"center",padding:24}}>Link inválido. Peça um novo link para a loja.</div>;

  const settings=store.settings||DEFAULT_SETTINGS;
  const storeName=store.name||"RoxoClub";
  const bonusPts=settings.bonus_complete_points||50;

  if(done&&client) return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0d0521,#1a0b3b)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#fff",borderRadius:24,padding:32,maxWidth:380,width:"100%",boxShadow:"0 24px 64px rgba(0,0,0,0.4)",textAlign:"center"}}>
        <div style={{fontSize:56,marginBottom:12}}>🎉</div>
        <div style={{fontWeight:800,fontSize:22,color:"#111",marginBottom:8}}>Bem-vindo, {client.name.split(" ")[0]}!</div>
        <div style={{fontSize:14,color:"#6b7280",marginBottom:24,lineHeight:1.6}}>Você está no programa de fidelidade da <strong>{storeName}</strong>. Acesse seu portal para ver seus pontos!</div>
        <a href={APP_URL+"/?token="+client.magic_token}
          style={{display:"block",padding:"14px 20px",background:"linear-gradient(135deg,#7c3aed,#6d28d9)",color:"#fff",fontWeight:700,fontSize:16,borderRadius:14,textDecoration:"none",marginBottom:12,boxShadow:"0 8px 24px rgba(109,40,217,0.4)"}}>
          💜 Ver meus pontos
        </a>
        <div style={{fontSize:12,color:"#9ca3af"}}>Salve este link para acessar sempre que quiser</div>
      </div>
    </div>
  );

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0d0521,#1a0b3b)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#fff",borderRadius:24,padding:32,maxWidth:380,width:"100%",boxShadow:"0 24px 64px rgba(0,0,0,0.4)"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <Logo size={44}/>
          <div style={{fontWeight:800,fontSize:20,color:"#111",marginTop:12,marginBottom:4}}>{storeName}</div>
          <div style={{fontSize:14,color:"#6b7280"}}>Programa de Fidelidade</div>
        </div>
        <div style={{background:"#ede9fe",borderRadius:12,padding:"12px 16px",marginBottom:20,textAlign:"center"}}>
          <div style={{fontWeight:700,color:"#6d28d9",fontSize:14}}>🎁 Cadastre-se e comece a acumular pontos!</div>
          <div style={{fontSize:12,color:"#7c3aed",marginTop:4}}>A cada compra você ganha pontos e troca por recompensas</div>
        </div>
        {err&&<div style={{background:"#fee2e2",color:"#dc2626",borderRadius:8,padding:"8px 12px",fontSize:13,marginBottom:12}}>{err}</div>}
        <div style={{marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:600,color:"#374151",marginBottom:5}}>Seu nome completo *</div>
          <input value={form.name} onChange={e=>{const v=e.target.value;setForm(p=>({...p,name:v.length>0?v.charAt(0).toUpperCase()+v.slice(1):v}));}}
            placeholder="Ex: João Silva"
            style={{width:"100%",padding:"11px 14px",borderRadius:10,border:"1.5px solid #e5e7eb",fontSize:15,outline:"none",boxSizing:"border-box"}}/>
        </div>
        <div style={{marginBottom:20}}>
          <div style={{fontSize:12,fontWeight:600,color:"#374151",marginBottom:5}}>WhatsApp *</div>
          <input value={phoneMask} onChange={e=>handlePhone(e.target.value)} inputMode="numeric"
            placeholder="(62) 9 9999-9999"
            style={{width:"100%",padding:"11px 14px",borderRadius:10,border:"1.5px solid #e5e7eb",fontSize:15,outline:"none",boxSizing:"border-box"}}/>
        </div>
        <button onClick={handleSubmit} disabled={saving}
          style={{width:"100%",padding:"14px",background:saving?"#d1d5db":"linear-gradient(135deg,#7c3aed,#6d28d9)",border:"none",borderRadius:12,color:"#fff",fontWeight:700,fontSize:16,cursor:saving?"not-allowed":"pointer",boxShadow:"0 8px 24px rgba(109,40,217,0.35)"}}>
          {saving?"Cadastrando...":"💜 Entrar no programa de fidelidade"}
        </button>
        <div style={{fontSize:11,color:"#9ca3af",marginTop:12,textAlign:"center"}}>Seus dados são protegidos · RoxoClub</div>
      </div>
    </div>
  );
}

function App() {
  const [session,setSession]=useState(undefined);
  const [store,setStore]=useState(null);
  const [view,setView]=useState("loading");
  const [attendantSession,setAttendantSession]=useState(null); // {attendant, store}
  const urlToken=new URLSearchParams(window.location.search).get("token");
  const urlRate=new URLSearchParams(window.location.search).get("rate");
  const urlCadastro=new URLSearchParams(window.location.search).get("cadastro");

  useEffect(()=>{
    if(urlRate){setView("rating");return;}
    if(urlToken){setView("client");return;}
    if(urlCadastro){setView("selfregister");return;}
    api.getSession().then(({data})=>{
      const s=data?.session;setSession(s||null);
      if(!s){setView("auth");return;}
      api.getStore(s.user.id).then(({data:st})=>{
        if(!st){setView("onboarding");return;}
        setStore(st);setView("admin");
      });
    });
    const {data:{subscription}}=sb.auth.onAuthStateChange((ev,s)=>{
      setSession(s);if(!s){setStore(null);setView("auth");}
    });
    return()=>subscription.unsubscribe();
  },[urlToken]);

  const handleAuth=async(su)=>{
    const uid=su?.user?.id||su?.id;
    const {data:st}=await api.getStore(uid);
    if(!st){setView("onboarding");return;}
    setStore(st);setView("admin");
  };

  const handleAttendantAuth=(attendant,storeData)=>{
    setAttendantSession({attendant,store:storeData});
    setView("attendant");
  };

  const handleSignOut=async()=>{await api.signOut();setSession(null);setStore(null);setView("auth");};
  const handleAttendantSignOut=()=>{setAttendantSession(null);setView("auth");};

  if(view==="selfregister") return <SelfRegisterPage storeId={urlCadastro}/>;
  if(view==="rating")  return <RatingPage token={urlRate}/>;
  if(view==="client")  return <ClientPortal token={urlToken}/>;
  if(view==="loading") return <div style={{minHeight:"100vh",background:C.r900,display:"flex",alignItems:"center",justifyContent:"center"}}><Spinner/></div>;
  if(view==="auth")    return <AuthScreen onAuth={handleAuth} onAttendantAuth={handleAttendantAuth}/>;
  if(view==="attendant"&&attendantSession) return <AttendantPanel attendant={attendantSession.attendant} storeData={attendantSession.store} onSignOut={handleAttendantSignOut}/>;
  if(view==="onboarding"&&session) return <OnboardingScreen user={session.user} onDone={st=>{setStore(st);setView("admin");}}/>;
  if(view==="admin"&&session&&store){
    if(!isPlanActive(store)) return <PlanExpiredScreen store={store} onSignOut={handleSignOut}/>;
    return <AdminPanel user={session.user} store={store} onSignOut={handleSignOut} onStoreUpdate={setStore}/>;
  }
  return <AuthScreen onAuth={handleAuth} onAttendantAuth={handleAttendantAuth}/>;
}

ReactDOM.render(<App/>,document.getElementById("root"));

</script>
</body>
</html>
