*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f0820;-webkit-font-smoothing:antialiased}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes modalIn{from{opacity:0;transform:scale(0.93) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(230px) rotate(720deg);opacity:0}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,0.4)}50%{box-shadow:0 0 0 8px rgba(124,58,237,0)}}
@keyframes levelUp{0%{transform:scale(0.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes countUp{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#4a1a7a;border-radius:4px}
input,select,textarea,button{font-family:'Segoe UI',system-ui,sans-serif}
a{color:#a855f7;text-decoration:none}
.hover-card{transition:transform 0.15s,box-shadow 0.15s;cursor:pointer}.hover-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.12)}
.skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e5e5e5 50%,#f0f0f0 75%);background-size:400px 100%;animation:shimmer 1.4s infinite;border-radius:8px}
/* ── RESPONSIVO MOBILE ── */
.admin-layout{display:flex;min-height:100vh;background:#f9fafb}
.admin-sidebar{width:220px;background:#0f0820;display:flex;flex-direction:column;flex-shrink:0;transition:transform 0.3s ease}
.admin-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.admin-content{flex:1;overflow:auto;padding:22px}
.mobile-nav{display:none}
.mobile-overlay{display:none}
.hamburger-btn{display:block}
@media(min-width:769px){
  .hamburger-btn{display:none!important}
  .admin-sidebar{transform:none!important}
}
@media(max-width:768px){
  .admin-sidebar{position:fixed;top:0;left:0;height:100vh;z-index:500;transform:translateX(-100%)}
  .admin-sidebar.open{transform:translateX(0)}
  .admin-content{padding:14px!important}
  .mobile-nav{display:flex!important}
  .mobile-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:499}
  .hide-mobile{display:none!important}
  .stat-grid{grid-template-columns:1fr 1fr!important}
  .campaign-grid{grid-template-columns:1fr!important}
  .client-table{font-size:12px}
  .quick-row{flex-direction:column!important}
}
@media(max-width:480px){
  .stat-grid{grid-template-columns:1fr 1fr!important}
}

const fmtDate = (iso) => {
  if(!iso) return "—";
  const s=iso.split("T")[0].split("-");
  if(s.length<3) return "—";
  return s[2]+"/"+s[1]+"/"+s[0];
};
const fmtDateTime= (iso) => iso ? new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";
const fmtPts     = (n)   => Number(n||0).toLocaleString("pt-BR");
const fmtMoney   = (n)   => Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const today      = ()    => new Date().toISOString().split("T")[0];
const daysDiff   = (iso) => iso ? Math.floor((Date.now()-new Date(iso))/(86400000)) : 9999;
const hourOfDay  = (iso) => iso ? new Date(iso).getHours() : null;
const isBirthday = (dob) => {
  if(!dob) return false;
  const s=dob.split("T")[0].split("-");
  if(s.length<3) return false;
  const now=new Date();
  return parseInt(s[2])===now.getDate() && parseInt(s[1])-1===now.getMonth();
};
const birthMonth = (dob) => dob ? new Date(dob).getMonth() : null;
const age = (dob) => {
  if(!dob) return null;
  const d=new Date(dob), now=new Date();
  let a=now.getFullYear()-d.getFullYear();
  if(now.getMonth()<d.getMonth()||(now.getMonth()===d.getMonth()&&now.getDate()<d.getDate())) a--;
  return a;
};
const fmtPhone = (v) => {
  const d=(v||"").replace(/\D/g,"");
  if(d.length<=2) return d;
  if(d.length<=6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length<=10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7,11)}`;
};
const rawPhone = (v) => (v||"").replace(/\D/g,"");

const fmtDobMask = (v) => {
  const d=(v||"").replace(/\D/g,"");
  if(d.length<=2) return d;
  if(d.length<=4) return d.slice(0,2)+"/"+d.slice(2);
  return d.slice(0,2)+"/"+d.slice(2,4)+"/"+d.slice(4,8);
};
const dobMaskToISO = (v) => {
  const d=(v||"").replace(/\D/g,"");
  if(d.length<8) return "";
  return d.slice(4,8)+"-"+d.slice(2,4)+"-"+d.slice(0,2);
};
const isoToDobMask = (iso) => {
  if(!iso||iso.length<10) return "";
  const [y,m,d]=iso.split("-");
  return (d||"")+"/"+(m||"")+"/"+(y||"");
};

const waLink = (phone,msg) => {
  const n=(phone||"").replace(/\D/g,"");
  return `https://wa.me/${n.startsWith("55")?n:"55"+n}?text=${encodeURIComponent(msg)}`;
};
const magicLink = (token) => `${APP_URL}/?token=${token}`;

const getPreferredHour = (txList) => {
  if(!txList||!txList.length) return null;
  const hours={};
  txList.forEach(t=>{const h=hourOfDay(t.created_at);if(h!==null){hours[h]=(hours[h]||0)+1;}});
  return Object.entries(hours).sort((a,b)=>b[1]-a[1])[0]?.[0];
};

const DEFAULT_SETTINGS = {

  expire_mode:"never", // "never"|"days"
  levels:{
    basico:{name:"Cliente",min:0,max:499,color:"#9ca3af",benefits:"Acesso ao programa de pontos"},
    vip1:  {name:"VIP Bronze",min:500,max:999,color:"#b45309",benefits:"5% de desconto em todas as compras"},
    vip2:  {name:"VIP Prata",min:1000,max:1999,color:"#6b7280",benefits:"10% de desconto + açaí grátis no aniversário"},
    vip3:  {name:"VIP Ouro",min:2000,max:999999,color:"#d97706",benefits:"15% de desconto + brinde exclusivo + fila preferencial"},

  msg_points:"Olá, {nome}! 🍇\nVocê fez uma compra na *{loja}* e ganhou *{pontos} pontos*!\n\n📊 Saldo: *{saldo} pts*\n🏆 Nível: {nivel}\n\n👉 Veja seus pontos e recompensas:\n{link}\n\n💜 *RoxoClub* — _Fidelidade_",

  msg_inactive:"Sentimos sua falta, {nome}! 😢\nFaz {dias} dias que você não aparece na *{loja}*.\n\n🎁 Que tal voltar e ganhar *pontos em dobro*?\n👉 {link}\n\n💜 *RoxoClub* — _Fidelidade_",
  msg_complete:"Olá, {nome}! Complete seu cadastro no RoxoClub e *ganhe {bonus} pontos* de bônus! 🎉\n👉 {link}\n\n💜 *RoxoClub* — _Fidelidade_",
  msg_ranking:"🏆 {nome}, você está em *#{posicao}* no ranking da *{loja}*!\nSeus pontos: *{saldo}*\nFaltam *{falta}* pts para o líder!\n👉 {link}\n\n💜 *RoxoClub* — _Fidelidade_",
  msg_custom:"Olá, {nome}! 🍇\n\n{loja} tem uma novidade especial pra você!\n\n👉 Acesse: {link}\n\n💜 *RoxoClub* — _Fidelidade_",
  birthday_gift:"Açaí 300ml grátis 🍇",
  inactive_days:30,
  bonus_complete_points:50,
  products:[],
  store_email:"",
  store_founded:"",
  store_segment:"",
  store_owner:"",
  store_address:"",
};

const getStoreName = (store, settings) => {
  const n = settings?.store_name || store?.name || "RoxoClub";
  return n.charAt(0).toUpperCase() + n.slice(1);
};

const api = {
  signIn:  (e,p) => sb.auth.signInWithPassword({email:e,password:p}),
  signUp:  (e,p) => sb.auth.signUp({email:e,password:p}),
  signOut: ()    => sb.auth.signOut(),
  getSession: () => sb.auth.getSession(),

  getStore:    (uid)       => sb.from("stores").select("*").eq("owner_id",uid).maybeSingle(),
  createStore: (uid,n,s,p) => sb.from("stores").insert({owner_id:uid,name:n,slug:s,phone:p,settings:DEFAULT_SETTINGS}).select().single(),
  updateSettings:(id,set)  => sb.from("stores").update({settings:set}).eq("id",id),

  listClients: (sid) => sb.from("clients").select("*").eq("store_id",sid).order("points",{ascending:false}),
  createClient:(sid,d) => sb.from("clients").insert({store_id:sid,...d}).select().single(),
  updateClient:(id,d)  => sb.from("clients").update(d).eq("id",id).select().single(),
  deleteClient:(id)    => sb.from("clients").delete().eq("id",id),
  clientByToken:(tok)  => sb.from("clients").select("*,stores(name,slug,settings,phone)").eq("magic_token",tok).maybeSingle(),

  listTx:     (sid,lim=200) => sb.from("transactions").select("*,clients(name,phone)").eq("store_id",sid).order("created_at",{ascending:false}).limit(lim),
  listClientTx:(cid)        => sb.from("transactions").select("*").eq("client_id",cid).order("created_at",{ascending:false}).limit(60),

  addPoints: async (sid,cid,amount,note,settings) => {
    const pts = Math.floor(amount*(settings.points_per_real||3));
    const {data:tx,error} = await sb.from("transactions").insert({
      store_id:sid,client_id:cid,type:"earn",points:pts,amount_paid:amount,note:note||null
    }).select().single();
    if(error) return {error};
    const {data:c} = await sb.from("clients").select("points,total_visits").eq("id",cid).single();
    const newPts = (c?.points||0)+pts;
    const newLevel = getLevel(newPts,settings.levels||DEFAULT_SETTINGS.levels);
    await sb.from("clients").update({points:newPts,total_visits:(c?.total_visits||0)+1,last_visit:new Date().toISOString(),level:newLevel}).eq("id",cid);
    return {data:{...tx,pts,newPts}};
  },

  addBonusPoints: async (sid,cid,pts,note) => {
    await sb.from("transactions").insert({store_id:sid,client_id:cid,type:"earn",points:pts,note:note||"Bônus"});
    const {data:c} = await sb.from("clients").select("points").eq("id",cid).single();
    const newPts=(c?.points||0)+pts;
    await sb.from("clients").update({points:newPts}).eq("id",cid);
    return newPts;
  },

  redeem: async (sid,cid,reward) => {
    const {data:c} = await sb.from("clients").select("points").eq("id",cid).single();
    if(!c||c.points<reward.points_cost) return {error:{message:"Pontos insuficientes"}};
    const {data:tx,error} = await sb.from("transactions").insert({store_id:sid,client_id:cid,reward_id:reward.id,type:"redeem",points:-reward.points_cost,note:"Resgate: "+reward.name}).select().single();
    if(error) return {error};
    await sb.from("clients").update({points:c.points-reward.points_cost}).eq("id",cid);
    return {data:tx};
  },

  listRewards: (sid) => sb.from("rewards").select("*").eq("store_id",sid).order("points_cost"),
  createReward:async(sid,d)=>{
    const p={store_id:sid,name:d.name,points_cost:d.points_cost};
    if(d.description) p.description=d.description;
    if(d.type) p.type=d.type;
    return sb.from("rewards").insert(p).select().single();
  },
  updateReward:(id,d) => sb.from("rewards").update(d).eq("id",id),
  toggleReward:(id,a) => sb.from("rewards").update({active:a}).eq("id",id),
  deleteReward:(id)   => sb.from("rewards").delete().eq("id",id),
  updateReward:(id,data) => sb.from("rewards").update(data).eq("id",id),
  blockClient:(id,blocked) => sb.from("clients").update({blocked}).eq("id",id),
  listRedemptions:(store_id)=>sb.from("redemption_requests").select("*,clients(name,phone,magic_token)").eq("store_id",store_id).eq("status","pending").order("created_at",{ascending:false}),
  confirmRedemption:async(req_id,client_id,points_cost,store_id)=>{
    const {data:cl}=await sb.from("clients").select("points").eq("id",client_id).single();
    const newPts=Math.max(0,(cl?.points||0)-points_cost);
    await sb.from("clients").update({points:newPts}).eq("id",client_id);
    await sb.from("transactions").insert({store_id,client_id,type:"redeem",points:points_cost,amount_paid:0,note:"Resgate confirmado"});
    return sb.from("redemption_requests").update({status:"confirmed"}).eq("id",req_id);
  },
  cancelRedemption:(req_id)=>sb.from("redemption_requests").update({status:"cancelled"}).eq("id",req_id),
  createRedemption:(store_id,client_id,reward_id,reward_name,points_cost)=>sb.from("redemption_requests").insert({store_id,client_id,reward_id,reward_name,points_cost,status:"pending"}).select().single(),
  getClientPendingRedemptions:(client_id)=>sb.from("redemption_requests").select("*").eq("client_id",client_id).eq("status","pending").order("created_at",{ascending:false}),
};

function getLevel(pts, levels) {
  const lvls = Object.entries(levels||DEFAULT_SETTINGS.levels).sort((a,b)=>b[1].min-a[1].min);
  for(const [key,l] of lvls) { if(pts>=l.min) return key; }
  return "basico";
}
function getLevelInfo(levelKey, levels) {
  return (levels||DEFAULT_SETTINGS.levels)[levelKey] || DEFAULT_SETTINGS.levels.basico;
}
function getLevelBadge(levelKey, levels) {
  const l = getLevelInfo(levelKey, levels);
  const icons = {basico:"👤",vip1:"🥉",vip2:"🥈",vip3:"🏆"};
  return {icon:icons[levelKey]||"👤", ...l};
}

function SkeletonLine({w="100%",h=14,mb=8}) {
  return <div className="skeleton" style={{width:w,height:h,marginBottom:mb,display:"block"}}/>;
}

function WAPreview({msg,storeName}) {
  if(!msg) return null;
  const lines=msg.split("\n").map((l,i)=>{
    const bold=l.replace(/\*(.*?)\*/g,"<strong>$1</strong>").replace(/_(.*?)_/g,"<em>$1</em>");
    return <p key={i} style={{margin:"2px 0",fontSize:13,lineHeight:1.5}} dangerouslySetInnerHTML={{__html:bold||"&nbsp;"}}/>;
  });
  return (
    <div style={{background:"#e8f5e9",borderRadius:12,padding:12,marginTop:10}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,paddingBottom:8,borderBottom:"1px solid rgba(0,0,0,0.07)"}}>
        <div style={{width:30,height:30,borderRadius:"50%",background:C.r400,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>🍇</div>
        <div><div style={{fontSize:12,fontWeight:700,color:"#1a1a1a"}}>{storeName||"RoxoClub"}</div><div style={{fontSize:10,color:"#666"}}>via WhatsApp</div></div>
      </div>
      <div style={{background:C.white,borderRadius:"4px 14px 14px 14px",padding:"9px 12px",boxShadow:"0 1px 2px rgba(0,0,0,0.1)",maxWidth:"88%"}}>
        {lines}
        <div style={{fontSize:10,color:"#aaa",textAlign:"right",marginTop:4}}>agora ✓✓</div>
      </div>
    </div>
  );
}

const Spinner = () => <div style={{display:"flex",alignItems:"center",justifyContent:"center",padding:48}}><div style={{width:32,height:32,border:`3px solid ${C.r100}`,borderTopColor:C.r400,borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/></div>;

function Toast({msg,type="success",onClose}) {
  useEffect(()=>{const t=setTimeout(onClose,3500);return()=>clearTimeout(t);},[]);
  const bg={success:C.r400,error:C.red,warn:C.gold,info:C.blue}[type]||C.r400;
  return <div onClick={onClose} style={{position:"fixed",bottom:24,right:24,zIndex:9999,background:bg,color:C.white,padding:"13px 20px",borderRadius:14,fontWeight:600,fontSize:14,boxShadow:"0 8px 30px rgba(0,0,0,0.3)",maxWidth:360,animation:"fadeUp 0.3s ease",cursor:"pointer"}}>{msg}</div>;
}

function Modal({title,onClose,children,wide=false}) {
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.white,borderRadius:20,padding:24,width:"100%",maxWidth:wide?760:480,maxHeight:"90vh",overflow:"auto",animation:"modalIn 0.25s ease",boxShadow:"0 24px 60px rgba(0,0,0,0.4)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <div style={{fontWeight:700,fontSize:16,color:C.g900}}>{title}</div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:C.g400,padding:"0 4px"}}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Input({label,hint,...props}) {
  return (
    <div style={{marginBottom:12}}>
      {label&&<div style={{fontSize:12,fontWeight:600,color:C.g700,marginBottom:5}}>{label}</div>}
      <input {...props} style={{width:"100%",padding:"9px 12px",borderRadius:9,border:`1.5px solid ${C.g200}`,fontSize:14,outline:"none",background:C.white,color:C.g900,...props.style}}/>
      {hint&&<div style={{fontSize:11,color:C.g400,marginTop:3}}>{hint}</div>}
    </div>
  );
}

function Select({label,children,...props}) {
  return (

function PointsCelebration({pts,newPts,clientName,newLevel,prevLevel,settings,onClose}) {
  const [show,setShow]=useState(false);
  const levels=settings?.levels||DEFAULT_SETTINGS.levels;
  const levChanged=newLevel!==prevLevel;
  const levelInfo=getLevelInfo(newLevel,levels);
  const levelKeys=Object.keys(levels).sort((a,b)=>levels[a].min-levels[b].min);
  const nextKey=levelKeys[levelKeys.indexOf(newLevel)+1];
  const nextLevel=nextKey?levels[nextKey]:null;
  const pct=nextLevel?Math.min(100,Math.round(((newPts-levelInfo.min)/(nextLevel.min-levelInfo.min))*100)):100;
  useEffect(()=>{setTimeout(()=>setShow(true),60);},[]);
  return (
    <>
      <Confetti active={show}/>
      <div style={{position:"fixed",inset:0,background:"rgba(8,4,18,0.88)",zIndex:9980,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={onClose}>
        <div onClick={e=>e.stopPropagation()} style={{background:C.white,borderRadius:24,padding:30,maxWidth:370,width:"100%",textAlign:"center",boxShadow:"0 32px 80px rgba(0,0,0,0.55)",animation:"modalIn 0.35s cubic-bezier(0.34,1.56,0.64,1)"}}>
          <div style={{width:76,height:76,borderRadius:"50%",background:`linear-gradient(135deg,${C.r500},${C.r300})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:34,margin:"0 auto 14px",animation:"bounce 0.5s 0.3s ease both",boxShadow:`0 8px 24px ${C.r400}55`}}>⭐</div>
          <div style={{fontSize:13,color:C.g600,marginBottom:4}}>Parabéns, {clientName.split(" ")[0]}!</div>
          <div style={{fontSize:50,fontWeight:800,color:C.r400,fontFamily:"Georgia,serif",lineHeight:1,animation:"countUp 0.4s 0.2s both"}}>+{fmtPts(pts)}</div>
          <div style={{fontSize:16,color:C.g700,fontWeight:600,marginBottom:18}}>pontos adicionados! 🎉</div>
          {levChanged&&(
            <div style={{background:`linear-gradient(135deg,${C.gold},${C.gold2})`,borderRadius:14,padding:"11px 16px",marginBottom:16,animation:"levelUp 0.5s 0.4s both"}}>
              <div style={{fontSize:22,marginBottom:3}}>{getLevelBadge(newLevel,levels).icon}</div>
              <div style={{fontWeight:800,fontSize:15,color:C.white}}>🆙 Subiu para {levelInfo.name}!</div>
              <div style={{fontSize:12,color:"rgba(255,255,255,0.85)",marginTop:2}}>{levelInfo.benefits}</div>
            </div>
          )}
          <div style={{background:C.r50,borderRadius:12,padding:"10px 14px",marginBottom:16}}>
            <div style={{fontSize:10,color:C.g600,marginBottom:1,textTransform:"uppercase",letterSpacing:0.5}}>Saldo total</div>
            <div style={{fontSize:28,fontWeight:800,color:C.r500,fontFamily:"Georgia,serif"}}>{fmtPts(newPts)} <span style={{fontSize:13,fontWeight:500}}>pts</span></div>
          </div>
          {nextLevel&&(
            <div style={{marginBottom:18}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.g600,marginBottom:5}}>
                <span>→ {nextLevel.name}</span><span>{pct}%</span>
              </div>
              <div style={{background:C.g200,borderRadius:8,height:9,overflow:"hidden"}}>
                <div style={{width:`${pct}%`,height:"100%",background:`linear-gradient(90deg,${C.r400},${C.r300})`,borderRadius:8,transition:"width 1s ease 0.5s"}}/>
              </div>
              <div style={{fontSize:11,color:C.g400,marginTop:3}}>Faltam {fmtPts(nextLevel.min-newPts)} pts para {nextLevel.name}</div>
            </div>
          )}
          <button onClick={onClose} style={{width:"100%",padding:"12px",borderRadius:12,border:"none",background:`linear-gradient(135deg,${C.r500},${C.r400})`,color:C.white,fontSize:15,fontWeight:700,cursor:"pointer",boxShadow:`0 4px 14px ${C.r400}55`}}>
            Continuar ✨
          </button>
        </div>
      </div>
    </>
  );
}

function CampaignModal({clients,store,onClose,showToast}) {
  const settings = store.settings||DEFAULT_SETTINGS;
  const [searchQ,setSearchQ]=useState("");
  const [sortCol,setSortCol]=useState(null);
  const [sortDir,setSortDir]=useState("desc");
  const [ptsFaixaFilter,setPtsFaixaFilter]=useState(null);
  const [visitFilter,setVisitFilter]=useState(null);
  const [selectedIds,setSelectedIds]=useState(new Set());
  const [filter,setFilter]=useState("all");
  const [msgType,setMsgType]=useState("points");
  const [msg,setMsg]=useState(settings.msg_points||DEFAULT_SETTINGS.msg_points);
  const [ageMin,setAgeMin]=useState(""); const [ageMax,setAgeMax]=useState("");
  const [inactiveDays,setInactiveDays]=useState(settings.inactive_days||30);
  const [birthMonthFilter,setBirthMonthFilter]=useState("");
  const [hourFilter,setHourFilter]=useState("");
  const [sending,setSending]=useState(false); const [sent,setSent]=useState(0);

  const months=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

  const msgTemplates = {
    points:  settings.msg_points  || DEFAULT_SETTINGS.msg_points,
    birthday:settings.msg_birthday|| DEFAULT_SETTINGS.msg_birthday,
    inactive:settings.msg_inactive|| DEFAULT_SETTINGS.msg_inactive,
    complete:settings.msg_complete|| DEFAULT_SETTINGS.msg_complete,
    ranking: settings.msg_ranking || DEFAULT_SETTINGS.msg_ranking,
    custom:  settings.msg_custom  || DEFAULT_SETTINGS.msg_custom,
  };

  const allFiltered = useMemo(()=>{
    let list=[...clients];
    if(filter==="birthday")    list=list.filter(c=>isBirthday(c.dob));
    if(filter==="inactive")    list=list.filter(c=>daysDiff(c.last_visit)>=(inactiveDays||30));
    if(filter==="vip")         list=list.filter(c=>c.level&&c.level!=="basico");
    if(filter==="basico")      list=list.filter(c=>!c.level||c.level==="basico");
    if(filter==="age")         list=list.filter(c=>{const a=age(c.dob);return a!==null&&a>=(ageMin||0)&&a<=(ageMax||999);});
    if(filter==="birthmonth"&&birthMonthFilter!=="") list=list.filter(c=>birthMonth(c.dob)===Number(birthMonthFilter));
    if(filter==="hour"&&hourFilter!=="") list=list.filter(c=>{
      return hourOfDay(c.last_visit)===Number(hourFilter);
    });
    return list;
  },[clients,filter,inactiveDays,ageMin,ageMax,birthMonthFilter,hourFilter]);

  const searchFiltered = useMemo(()=>{
    if(!searchQ) return allFiltered;
    return allFiltered.filter(c=>c.name.toLowerCase().includes(searchQ.toLowerCase())||c.phone.includes(searchQ));
  },[allFiltered,searchQ]);

  useEffect(()=>{
    setSelectedIds(new Set(allFiltered.map(c=>c.id)));
  },[filter,inactiveDays,ageMin,ageMax,birthMonthFilter,hourFilter]);

  const toggleClient=(id)=>{
    setSelectedIds(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
  };
  const selectAll=()=>setSelectedIds(new Set(searchFiltered.map(c=>c.id)));
  const clearAll=()=>setSelectedIds(new Set());

  const buildMsg = (client) => {
    const level=getLevelBadge(client.level||"basico",settings.levels||DEFAULT_SETTINGS.levels);
    const sorted=[...clients].sort((a,b)=>b.points-a.points);
    const pos=sorted.findIndex(c=>c.id===client.id)+1;
    const leader=sorted[0];
    return (msg||"")
      .replace(/\{nome\}/g,client.name.split(" ")[0])
      .replace(/\{saldo\}/g,fmtPts(client.points))
      .replace(/\{pontos\}/g,fmtPts(client.points))
      .replace(/\{nivel\}/g,level.name)
      .replace(/\{link\}/g,magicLink(client.magic_token||""))
      .replace(/\{loja\}/g,getStoreName(store,settings))
      .replace(/\{dias\}/g,String(daysDiff(client.last_visit)))
      .replace(/\{brinde\}/g,settings.birthday_gift||"brinde especial")
      .replace(/\{posicao\}/g,String(pos))
      .replace(/\{falta\}/g,fmtPts(Math.max(0,(leader?.points||0)-client.points)))
      .replace(/\{bonus\}/g,String(settings.bonus_complete_points||50));
  };

  const selectedClients = clients.filter(c=>selectedIds.has(c.id));
  const previewClient = selectedClients[0]||clients[0];

  const sendAll = async () => {
    if(!selectedClients.length){showToast("Selecione pelo menos um cliente","error");return;}
    if(!msg||!msg.trim()){showToast("Digite uma mensagem","error");return;}
    setSending(true);
    let count=0;
    for(const c of selectedClients){
      const built=buildMsg(c);
      window.open(waLink(c.phone,built),"_blank");
      count++;
      setSent(count);
      await new Promise(r=>setTimeout(r,800));
    }
    setSending(false);
    showToast(`✅ ${count} mensagens enviadas!`);
    onClose();
  };

  return (
    <Modal title="📢 Campanha — Enviar mensagens" onClose={onClose} wide>
      <div className="campaign-grid" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
        
        <div>
          <div style={{fontSize:12,fontWeight:700,color:C.g700,marginBottom:8,textTransform:"uppercase",letterSpacing:0.5}}>1. Selecionar público</div>
          <Select value={filter} onChange={e=>{setFilter(e.target.value);setBirthMonthFilter("");setHourFilter("");}}>
            <option value="all">👥 Todos os clientes ({clients.length})</option>
            <option value="birthday">🎂 Aniversariantes de hoje</option>
            <option value="birthmonth">📅 Por mês de aniversário</option>
            <option value="inactive">😴 Inativos (X dias)</option>
            <option value="vip">⭐ Clientes VIP</option>
            <option value="basico">👤 Clientes Básicos</option>
            <option value="age">🎂 Por faixa etária</option>
            <option value="hour">⏰ Por horário de visita</option>
          </Select>

          {filter==="inactive"&&<Input label="Dias sem comprar" type="number" value={inactiveDays} onChange={e=>setInactiveDays(e.target.value)} placeholder="30"/>}
          {filter==="age"&&<div style={{display:"flex",gap:8}}><Input label="Idade mín." type="number" value={ageMin} onChange={e=>setAgeMin(e.target.value)} placeholder="18"/><Input label="Idade máx." type="number" value={ageMax} onChange={e=>setAgeMax(e.target.value)} placeholder="60"/></div>}
          {filter==="birthmonth"&&(
            <Select label="Mês de aniversário" value={birthMonthFilter} onChange={e=>setBirthMonthFilter(e.target.value)}>
              <option value="">Selecione o mês</option>
              {months.map((m,i)=><option key={i} value={i}>{m}</option>)}
            </Select>
          )}
          {filter==="hour"&&(
            <Select label="Horário de visita" value={hourFilter} onChange={e=>setHourFilter(e.target.value)}>
              <option value="">Selecione o horário</option>
              {Array.from({length:16},(_,i)=>i+8).map(h=><option key={h} value={h}>{String(h).padStart(2,"0")}:00 — {String(h+1).padStart(2,"0")}:00</option>)}
            </Select>
          )}

          
          <input value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="🔍 Buscar por nome ou telefone..." style={{width:"100%",padding:"7px 10px",borderRadius:8,border:`1px solid ${C.g200}`,fontSize:13,marginBottom:8,outline:"none"}}/>

          
          <div style={{display:"flex",gap:6,marginBottom:6}}>
            <button onClick={selectAll} style={{fontSize:11,padding:"4px 10px",borderRadius:7,border:`1px solid ${C.r300}`,background:C.r50,color:C.r500,cursor:"pointer",fontWeight:600}}>Selecionar todos</button>

            <option value="inactive">😴 Chamar inativos</option>
            <option value="complete">⚠️ Completar cadastro</option>
            <option value="ranking">🏆 Posição no ranking</option>
            <option value="custom">✏️ Mensagem personalizada</option>
          </Select>
          <Textarea label="Mensagem (edite à vontade)" value={msg} onChange={e=>setMsg(e.target.value)} rows={7} placeholder="Digite a mensagem..."/>
          <div style={{padding:"8px 10px",background:C.r50,borderRadius:8,fontSize:11,color:C.r500,lineHeight:1.7,marginBottom:8}}>
            <strong>Variáveis:</strong> {"{nome}"} {"{saldo}"} {"{nivel}"} {"{link}"} {"{loja}"} {"{dias}"} {"{brinde}"} {"{posicao}"} {"{falta}"} {"{bonus}"}
          </div>
          {previewClient&&msg&&(
            <WAPreview msg={buildMsg(previewClient)} storeName={getStoreName(store,settings)}/>
          )}
        </div>
      </div>

      <div style={{marginTop:20,display:"flex",gap:10,justifyContent:"flex-end",alignItems:"center",borderTop:`1px solid ${C.g100}`,paddingTop:16}}>
        {sending&&<span style={{fontSize:13,color:C.g600}}>Enviando {sent}/{selectedIds.size}...</span>}
        <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
        <Btn loading={sending} disabled={selectedIds.size===0||!msg||!msg.trim()} onClick={sendAll}>
          📤 Enviar para {selectedIds.size} cliente{selectedIds.size!==1?"s":""}
        </Btn>
      </div>
    </Modal>
  );
}

function RankingPanel({client,allClients,settings}) {
  const levels=settings?.levels||DEFAULT_SETTINGS.levels;
  const sorted=[...allClients].sort((a,b)=>b.points-a.points);
  const myPos=sorted.findIndex(c=>c.id===client.id)+1;
  const leader=sorted[0];
  const myLevel=getLevel(client.points,levels);
  const myInfo=getLevelInfo(myLevel,levels);
  const levelKeys=Object.keys(levels).sort((a,b)=>levels[a].min-levels[b].min);
  const nextLevelKey=levelKeys[levelKeys.indexOf(myLevel)+1];
  const nextLevel=nextLevelKey?levels[nextLevelKey]:null;
  const pctToNext=nextLevel?Math.min(100,Math.round(((client.points-myInfo.min)/(nextLevel.min-myInfo.min))*100)):100;
  return (
    <div style={{padding:"0 0 20px"}}>
      <div style={{background:`linear-gradient(135deg,${C.r800},${C.r600})`,borderRadius:18,padding:20,marginBottom:16,color:C.white,textAlign:"center"}}>
        <div style={{fontSize:12,color:C.r200,letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>Sua posição</div>
        <div style={{fontSize:52,fontWeight:700,fontFamily:"Georgia,serif",lineHeight:1}}>#{myPos}</div>
        <div style={{fontSize:13,color:C.r200,marginTop:4}}>de {allClients.length} clientes</div>
        <div style={{marginTop:12,padding:"6px 16px",background:"rgba(255,255,255,0.1)",borderRadius:20,display:"inline-block",fontSize:13,fontWeight:600}}>
          {getLevelBadge(myLevel,levels).icon} {myInfo.name}
        </div>
      </div>
      {nextLevel&&(
        <div style={{background:C.white,borderRadius:14,padding:16,marginBottom:14,border:`1px solid ${C.g100}`}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <span style={{fontSize:13,fontWeight:600,color:C.g900}}>🎯 Próximo nível: {nextLevel.name}</span>
            <span style={{fontSize:12,color:C.g600}}>{fmtPts(client.points)}/{fmtPts(nextLevel.min)}</span>
          </div>
          <div style={{background:C.g100,borderRadius:8,height:10,overflow:"hidden",marginBottom:8}}>
            <div style={{width:`${pctToNext}%`,height:"100%",background:`linear-gradient(90deg,${C.r400},${C.r300})`,borderRadius:8}}/>
          </div>
          <div style={{fontSize:12,color:C.r500}}>Faltam <strong>{fmtPts(nextLevel.min-client.points)}</strong> pts · {nextLevel.benefits}</div>
        </div>
      )}
      {leader&&leader.id!==client.id&&(
        <div style={{background:C.goldL,borderRadius:12,padding:"12px 16px",marginBottom:14,border:"1px solid #fcd34d"}}>
          <div style={{fontSize:12,fontWeight:600,color:"#92400e",marginBottom:2}}>🏆 Líder: {leader.name.split(" ")[0]}</div>
          <div style={{fontSize:13,color:"#78350f"}}>Faltam <strong>{fmtPts(leader.points-client.points)}</strong> pts para o 1º lugar</div>
        </div>
      )}
      <div style={{fontSize:13,fontWeight:700,color:C.g700,marginBottom:8}}>📊 Top 5 clientes</div>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {sorted.slice(0,5).map((c,i)=>{
          const isMe=c.id===client.id;
          const medals=["🥇","🥈","🥉","4️⃣","5️⃣"];
          return (
            <div key={c.id} style={{padding:"10px 14px",borderRadius:10,background:isMe?C.r50:C.white,border:`1px solid ${isMe?C.r300:C.g100}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{display:"flex",gap:10,alignItems:"center"}}>
                <span style={{fontSize:18}}>{medals[i]}</span>
                <span style={{fontSize:13,fontWeight:isMe?700:500,color:isMe?C.r500:C.g900}}>{isMe?`${c.name.split(" ")[0]} (você)`:c.name.split(" ")[0]}</span>
              </div>
              <span style={{fontWeight:700,color:isMe?C.r500:C.g700,fontSize:14}}>{fmtPts(c.points)} pts</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function AdminPanel({user,store,onSignOut}) {
  const [tab,setTab]=useState("dashboard");
  const [clients,setClients]=useState([]);
  const [txs,setTxs]=useState([]);
  const [rewards,setRewards]=useState([]);
  const [loading,setLoading]=useState(true);
  const [toast,setToast]=useState(null);
  const [modal,setModal]=useState(null);
  const [redemptions,setRedemptions]=useState([]);
  const [editReward,setEditReward]=useState(null);
  const [importModal,setImportModal]=useState(false);
  const [importRows,setImportRows]=useState([]);
  const [importing,setImporting]=useState(false);
  const [msgPreview,setMsgPreview]=useState(null);
  const [selClient,setSel]=useState(null);
  const [searchQ,setSearch]=useState("");
  const [selected,setSelected]=useState(new Set());
  const [clientForm,setCF]=useState({name:"",phone:"",email:"",dob:"",notes:""});
  const [editForm,setEF]=useState({name:"",phone:"",email:"",dob:"",notes:""});
  const [pointsForm,setPF]=useState({value:"",note:""});
  const [rewardForm,setRF]=useState({name:"",points_cost:"",type:"product",description:"",tag:""});
  const [settings,setSettings]=useState({...DEFAULT_SETTINGS,...(store.settings||{})});
  const [savingSett,setSavingSett]=useState(false);
  const [showCampaign,setShowCampaign]=useState(false);
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const isMobile=typeof window!=='undefined'&&window.innerWidth<=768;
  const [dateFilter,setDateFilter]=useState("month");
  const [dateFrom,setDateFrom]=useState("");
  const [dateTo,setDateTo]=useState("");
  const [quickSearch,setQuickSearch]=useState("");
  const [quickClient,setQuickClient]=useState(null);
  const [quickValue,setQuickValue]=useState("");
  const [showQuickList,setShowQuickList]=useState(false);
  const [fromPoints,setFromPoints]=useState(false);
  const [sortCol,setSortCol]=useState(null);
  const [sortDir,setSortDir]=useState("desc");
  const [ptsFaixaFilter,setPtsFaixaFilter]=useState(null);
  const [visitFilter,setVisitFilter]=useState(null);
  const [savingBlock,setSavingBlock]=useState(null);

  const showToast=(msg,type="success")=>setToast({msg,type});

  const load=useCallback(async()=>{
    setLoading(true);
    const [c,t,r,rd]=await Promise.all([api.listClients(store.id),api.listTx(store.id),api.listRewards(store.id),api.listRedemptions(store.id)]);
    setClients(c.data||[]);setTxs(t.data||[]);setRewards(r.data||[]);setRedemptions(rd.data||[]);
    setLoading(false);
  },[store.id]);

  useEffect(()=>{load();},[load]);

  useEffect(()=>{
    if(!clients.length) return;
    const birthdays=clients.filter(c=>isBirthday(c.dob));
    if(birthdays.length>0) showToast(`🎂 ${birthdays.length} aniversariante(s) hoje!`,"warn");
  },[clients]);

  const filteredTxs = useMemo(()=>{
    const now=new Date();
    let from=null, to=null;
    if(dateFilter==="today"){from=new Date(now.getFullYear(),now.getMonth(),now.getDate());to=new Date(from.getTime()+86400000);}
    else if(dateFilter==="week"){from=new Date(now-7*86400000);to=new Date();}
    else if(dateFilter==="month"){from=new Date(now.getFullYear(),now.getMonth(),1);to=new Date();}
    else if(dateFilter==="year"){from=new Date(now.getFullYear(),0,1);to=new Date();}
    else if(dateFilter==="custom"){from=dateFrom?new Date(dateFrom):null;to=dateTo?new Date(dateTo+"T23:59:59"):null;}
    return txs.filter(t=>{
      if(!from&&!to) return true;
      const d=new Date(t.created_at);
      if(from&&d<from) return false;
      if(to&&d>to) return false;
      return true;
    });
  },[txs,dateFilter,dateFrom,dateTo]);

  const totalSales    = filteredTxs.filter(t=>t.type==="earn").reduce((a,t)=>a+(t.amount_paid||0),0);
  const salesCount    = filteredTxs.filter(t=>t.type==="earn").length;
  const totalPts      = clients.reduce((a,c)=>a+(c.points||0),0);
  const vipCount      = clients.filter(c=>c.level&&c.level!=="basico").length;
  const redeemCount   = txs.filter(t=>t.type==="redeem").length;
  const inactiveCount = clients.filter(c=>daysDiff(c.last_visit)>=(settings.inactive_days||30)).length;
  const birthdayCount = clients.filter(c=>isBirthday(c.dob)).length;

  const filtered=useMemo(()=>{
    let list=clients.filter(c=>
      c.name.toLowerCase().includes(searchQ.toLowerCase())||
      (c.phone||"").includes(searchQ)
    );
    if(ptsFaixaFilter){
      const [min,max]=ptsFaixaFilter;
      list=list.filter(c=>(c.points||0)>=min&&(max===null||(c.points||0)<=max));
    }
    if(visitFilter){
      list=list.filter(c=>daysDiff(c.last_visit)>=visitFilter);
    }
    if(sortCol){
      list=[...list].sort((a,b)=>{
        let va,vb;
        if(sortCol==="points"){va=a.points||0;vb=b.points||0;}
        else if(sortCol==="visits"){va=a.total_visits||0;vb=b.total_visits||0;}
        else if(sortCol==="last_visit"){va=a.last_visit?new Date(a.last_visit).getTime():0;vb=b.last_visit?new Date(b.last_visit).getTime():0;}
        else{va=0;vb=0;}
        return sortDir==="desc"?vb-va:va-vb;
      });
    }
    return list;
  },[clients,searchQ,sortCol,sortDir,ptsFaixaFilter,visitFilter]);

  const toggleSort=(col)=>{
    if(sortCol===col) setSortDir(d=>d==="desc"?"asc":"desc");
    else{setSortCol(col);setSortDir("desc");}
  };
  const sortArrow=(col)=>sortCol===col?(sortDir==="desc"?" ▼":" ▲"):" ⇅";

  const quickFiltered=useMemo(()=>{
    const sorted=[...clients].sort((a,b)=>{
      const da=a.last_visit?new Date(a.last_visit).getTime():0;
      const db=b.last_visit?new Date(b.last_visit).getTime():0;
      return db-da;
    });
    if(!quickSearch||quickSearch.length<1) return sorted.slice(0,10);
    return sorted.filter(c=>
      c.name.toLowerCase().includes(quickSearch.toLowerCase())||
      (c.phone||"").includes(quickSearch)
    ).slice(0,10);
  },[clients,quickSearch]);

  const handleAddClient=async(goToPoints=false)=>{
    if(!clientForm.name||!clientForm.phone){showToast("Nome e telefone são obrigatórios","error");return;}
    const {data,error}=await api.createClient(store.id,{
      name:clientForm.name,
      phone:rawPhone(clientForm.phone),
      email:clientForm.email||null,
      dob:clientForm.dob||null,
      notes:clientForm.notes||null,
    });
    if(error){showToast(error.message,"error");return;}
    setClients(p=>[data,...p]);
    setCF({name:"",phone:"",email:"",dob:"",dobMask:"",notes:""});
    showToast("✅ Cliente cadastrado!");
    if(goToPoints||fromPoints){
      setFromPoints(false);
      setModal(null);
      setQuickClient(data);
      setQuickSearch(data.name);
    } else {
      setModal(null);
    }
  };

  const handleEditClient=async()=>{
    if(!selClient) return;
    const wasIncomplete=!selClient.email||!selClient.dob;
    const nowComplete=!!(editForm.email||selClient.email)&&!!(editForm.dob||selClient.dob);
    const {data,error}=await api.updateClient(selClient.id,{
      name:editForm.name||selClient.name,
      phone:rawPhone(editForm.phone||selClient.phone),
      email:editForm.email||selClient.email||null,
      dob:editForm.dob||selClient.dob||null,
      notes:editForm.notes!=null?editForm.notes:(selClient.notes||null),
    });
    if(error){showToast(error.message,"error");return;}
    if(wasIncomplete&&nowComplete&&!selClient.profile_completed){
      const bonusPts=settings.bonus_complete_points||50;
      await api.addBonusPoints(store.id,selClient.id,bonusPts,"Bônus cadastro completo (loja)");
      await api.updateClient(selClient.id,{profile_completed:true});
      showToast(`✅ Cadastro completo! Cliente ganhou ${bonusPts} pontos!`);
    } else {
      showToast("✅ Cadastro atualizado!");
    }
    await load();
    setModal(null);setSel(null);
  };

  function parseCSV(text){
    var lines=text.trim().split(/\r?\n/);
    if(!lines.length) return [];
    var header=lines[0].toLowerCase().split(/[;,\t]/);
    return lines.slice(1).map(function(line){
      var cols=line.split(/[;,\t]/);
      var obj={};
      header.forEach(function(h,i){ obj[h.trim()]=cols[i]?cols[i].trim():""; });
      return {name:obj.nome||obj.name||"",phone:obj.telefone||obj.phone||obj.celular||"",email:obj.email||"",dob:obj.nascimento||obj.dob||obj["data de nascimento"]||"",notes:obj.observacao||obj.notes||""};
    }).filter(function(r){ return r.name||r.phone; });
  }
  const handleImportCSV=async()=>{
    if(!importRows.length) return;
    setImporting(true);
    var ok=0,fail=0;
    for(var i=0;i<importRows.length;i++){
      var row=importRows[i];
      if(!row.name||!row.phone) continue;
      var phone=row.phone.replace(/\D/g,"");
      var exists=clients.find(c=>c.phone===phone);
      if(exists){fail++;continue;}
      var res=await api.addClient(store.id,row.name,phone,row.email||"",row.dob||"",row.notes||"");
      if(res.data) ok++;
      else fail++;
    }
    await load();
    setImporting(false);
    setImportModal(false);
    setImportRows([]);
    showToast("✅ "+ok+" importados, "+fail+" ignorados");
  };
  const handleToggleBlock=async()=>{
    if(!selClient) return;
    const newBlocked=!selClient.blocked;
    await api.blockClient(selClient.id,newBlocked);
    setClients(p=>p.map(c=>c.id===selClient.id?{...c,blocked:newBlocked}:c));
    setSel(prev=>({...prev,blocked:newBlocked}));
    showToast(newBlocked?"🚫 Cliente bloqueado":"✅ Cliente desbloqueado");
  };
  const handleSaveReward=async()=>{
    if(!editReward) return;
    await api.updateReward(editReward.id,{name:editReward.name,points_cost:parseInt(editReward.points_cost)||0,description:editReward.description||""});
    setRewards(p=>p.map(r=>r.id===editReward.id?{...r,...editReward}:r));
    setEditReward(null);
    showToast("✅ Recompensa atualizada!");
  };
  const handleConfirmRedemption=async(req)=>{
    if(!window.confirm(`Confirmar resgate de "${req.reward_name}" para ${req.clients?.name}?`)) return;
    await api.confirmRedemption(req.id,req.client_id,req.points_cost,store.id);
    showToast("✅ Resgate confirmado! Pontos descontados.");
    load();
  };
  const handleCancelRedemption=async(req_id)=>{
    await api.cancelRedemption(req_id);
    showToast("Resgate cancelado.");
    load();
  };
  const handleAddPoints=async()=>{
    if(!pointsForm.value||parseFloat(pointsForm.value)<=0){showToast("Informe o valor da compra","error");return;}
    const {data,error}=await api.addPoints(store.id,selClient.id,parseFloat(pointsForm.value),pointsForm.note,settings);
    if(error){showToast(error.message,"error");return;}
    const pts=data?.pts||0;
    const newPts=data?.newPts||selClient.points+pts;
    const newLevel=getLevel(newPts,settings.levels||DEFAULT_SETTINGS.levels);
    const levelName=getLevelInfo(newLevel,settings.levels||DEFAULT_SETTINGS.levels).name;
    const waMsg=(settings.msg_points||DEFAULT_SETTINGS.msg_points)
      .replace(/\{nome\}/g,selClient.name.split(" ")[0])
      .replace(/\{pontos\}/g,fmtPts(pts))
      .replace(/\{saldo\}/g,fmtPts(newPts))
      .replace(/\{nivel\}/g,levelName)
      .replace(/\{link\}/g,magicLink(selClient.magic_token||""))
      .replace(/\{loja\}/g,getStoreName(store,settings));
    await load();
    setModal(null);setPF({value:"",note:""});setSel(null);
    showToast(`✅ ${fmtPts(pts)} pontos adicionados para ${selClient.name.split(" ")[0]}!`);
    setTimeout(()=>window.open(waLink(selClient.phone,waMsg),"_blank"),400);
  };

  const handleQuickPoints=async()=>{
    if(!quickClient||!quickValue||parseFloat(quickValue)<=0){showToast("Selecione o cliente e informe o valor","error");return;}
    const {data,error}=await api.addPoints(store.id,quickClient.id,parseFloat(quickValue),"",settings);
    if(error){showToast(error.message,"error");return;}
    const pts=data?.pts||0;
    const newPts=data?.newPts||quickClient.points+pts;
    const newLevel=getLevel(newPts,settings.levels||DEFAULT_SETTINGS.levels);
    const levelName=getLevelInfo(newLevel,settings.levels||DEFAULT_SETTINGS.levels).name;
    const waMsg=(settings.msg_points||DEFAULT_SETTINGS.msg_points)
      .replace(/\{nome\}/g,quickClient.name.split(" ")[0])
      .replace(/\{pontos\}/g,fmtPts(pts))
      .replace(/\{saldo\}/g,fmtPts(newPts))
      .replace(/\{nivel\}/g,levelName)
      .replace(/\{link\}/g,magicLink(quickClient.magic_token||""))
      .replace(/\{loja\}/g,getStoreName(store,settings));
    await load();
    setQuickClient(null);setQuickValue("");setQuickSearch("");
    showToast(`✅ ${fmtPts(pts)} pontos para ${quickClient.name.split(" ")[0]}!`);
    setTimeout(()=>window.open(waLink(quickClient.phone,waMsg),"_blank"),400);
  };

  const handleAddReward=async()=>{
    if(!rewardForm.name||!rewardForm.points_cost){showToast("Preencha nome e pontos","error");return;}
    const {data,error}=await api.createReward(store.id,{...rewardForm,points_cost:parseInt(rewardForm.points_cost)});
    if(error){showToast(error.message,"error");return;}
    setRewards(p=>[...p,data]);setRF({name:"",points_cost:"",type:"product",description:"",tag:""});
    setModal(null);showToast("🎁 Recompensa criada!");
  };

  const saveSettingsBlock=async(blockName)=>{
    setSavingBlock(blockName);
    const {error}=await api.updateSettings(store.id,settings);
    if(error) showToast("Erro ao salvar","error");
    else showToast("✅ Salvo!");
    setSavingBlock(null);
  };
  const handleSaveSettings=async()=>{
    setSavingSett(true);
    await api.updateSettings(store.id,settings);
    setSavingSett(false);showToast("✅ Configurações salvas!");
  };

  const sendBirthday=(c)=>{
    const msg=(settings.msg_birthday||DEFAULT_SETTINGS.msg_birthday)
      .replace(/\{nome\}/g,c.name.split(" ")[0])
      .replace(/\{brinde\}/g,settings.birthday_gift||"brinde especial")
      .replace(/\{link\}/g,magicLink(c.magic_token||""))
      .replace(/\{loja\}/g,getStoreName(store,settings));
    setMsgPreview({phone:c.phone,msg,name:c.name});
  };

  const sendIncomplete=(c)=>{
    const msg=(settings.msg_complete||DEFAULT_SETTINGS.msg_complete)
      .replace(/\{nome\}/g,c.name.split(" ")[0])
      .replace(/\{link\}/g,magicLink(c.magic_token||""))
      .replace(/\{bonus\}/g,String(settings.bonus_complete_points||50))
      .replace(/\{loja\}/g,getStoreName(store,settings));
    setMsgPreview({phone:c.phone,msg,name:c.name});
  };

  const toggleSelect=(id)=>{const n=new Set(selected);n.has(id)?n.delete(id):n.add(id);setSelected(n);};
  const selectAll=()=>setSelected(filtered.length===selected.size?new Set():new Set(filtered.map(c=>c.id)));

  const sendToSelected=(template)=>{
    const sel=filtered.filter(c=>selected.has(c.id));
    if(!sel.length){showToast("Nenhum cliente selecionado","error");return;}
    sel.forEach((c,i)=>setTimeout(()=>{
      const msg=(template||settings.msg_custom||DEFAULT_SETTINGS.msg_custom)
        .replace(/\{nome\}/g,c.name.split(" ")[0])
        .replace(/\{saldo\}/g,fmtPts(c.points))
        .replace(/\{nivel\}/g,getLevelInfo(c.level||"basico",settings.levels||DEFAULT_SETTINGS.levels).name)
        .replace(/\{link\}/g,magicLink(c.magic_token||""))
        .replace(/\{loja\}/g,getStoreName(store,settings))
        .replace(/\{bonus\}/g,String(settings.bonus_complete_points||50));
      window.open(waLink(c.phone,msg),"_blank");
    },i*800));
    showToast(`📤 Enviando para ${sel.length} clientes...`);
  };

  const tabs=[
    {id:"dashboard", icon:"🏠", label:"Central de Vendas"},
    {id:"clients",   icon:"👥", label:"Clientes & Campanhas"},
    {id:"ranking",   icon:"🏆", label:"Ranking"},
    {id:"rewards",   icon:"🎁", label:"Recompensas"},
    {id:"settings",  icon:"⚙️", label:"Configurações"},
  ];

  var hasRedemptions=redemptions.length>=1;
  var hasEditReward=!!editReward;
  var hasImportModal=!!importModal;
  var hasMsgPreview=!!msgPreview;
  var hasBirthdays=birthdayCount>=1;
  var hasInactive=inactiveCount>=1;
  return (
    <div className="admin-layout">
      
      {sidebarOpen&&<div className="mobile-overlay" onClick={()=>setSidebarOpen(false)}/>}

      
      <div className={`admin-sidebar${sidebarOpen?" open":""}`}>
        <div style={{padding:"20px 16px 14px",borderBottom:"1px solid rgba(255,255,255,0.07)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <Logo size={28}/>
          <button onClick={()=>setSidebarOpen(false)} style={{background:"none",border:"none",color:"rgba(255,255,255,0.4)",fontSize:20,cursor:"pointer",display:"none"}} className="hide-desktop">✕</button>

        <div style={{background:C.white,borderRadius:20,padding:24,width:"100%",maxWidth:460}} onClick={e=>e.stopPropagation()}>
          <div style={{fontWeight:700,fontSize:17,color:C.g900,marginBottom:8}}>📥 Importar Clientes via CSV</div>
          <div style={{fontSize:12,color:C.g500,marginBottom:16}}>Colunas aceitas: nome, telefone, email, nascimento, observacao</div>
          <input type="file" accept=".csv,.txt" onChange={e=>{var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=ev=>{setImportRows(parseCSV(ev.target.result));};r.readAsText(f);}} style={{width:"100%",marginBottom:12,fontSize:13}}/>
          {importRows.length>=1&&(
            <div style={{background:"#f0fdf4",borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:13,color:C.greenD}}>
              ✅ {importRows.length} clientes encontrados para importar
            </div>
          )}
          <div style={{display:"flex",gap:8}}>
            <Btn full variant="ghost" onClick={()=>{setImportModal(false);setImportRows([]); }}>Cancelar</Btn>
            <Btn full variant="primary" onClick={handleImportCSV}>{importing?"Importando...":"Importar"}</Btn>
          </div>
        </div>
      </div>
    )}
    {hasEditReward&&(
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={()=>setEditReward(null)}>
        <div style={{background:C.white,borderRadius:20,padding:24,width:"100%",maxWidth:400}} onClick={e=>e.stopPropagation()}>
          <div style={{fontWeight:700,fontSize:17,color:C.g900,marginBottom:18}}>✏️ Editar Recompensa</div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:600,color:C.g600,marginBottom:4}}>Nome</div>
            <input value={editReward.name} onChange={e=>setEditReward(p=>({...p,name:e.target.value}))} style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid #e5e7eb",fontSize:14}}/>
          </div>
          <div style={{marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:600,color:C.g600,marginBottom:4}}>Pontos necessários</div>
            <input type="number" value={editReward.points_cost} onChange={e=>setEditReward(p=>({...p,points_cost:e.target.value}))} style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid #e5e7eb",fontSize:14}}/>
          </div>
          <div style={{marginBottom:20}}>
            <div style={{fontSize:12,fontWeight:600,color:C.g600,marginBottom:4}}>Descrição (opcional)</div>
            <input value={editReward.description||""} onChange={e=>setEditReward(p=>({...p,description:e.target.value}))} style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"1px solid #e5e7eb",fontSize:14}}/>
          </div>
          <div style={{display:"flex",gap:8}}>
            <Btn full variant="ghost" onClick={()=>setEditReward(null)}>Cancelar</Btn>
            <Btn full variant="primary" onClick={handleSaveReward}>Salvar</Btn>
          </div>
        </div>
      </div>
    )}
    </div>

  );
}

function ClientPortal({token}) {
  const [client,setClient]=useState(null);
  const [allClients,setAllClients]=useState([]);
  const [rewards,setRewards]=useState([]);
  const [txs,setTxs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [notFound,setNotFound]=useState(false);
  const [msg,setMsg]=useState(null);
  const [tab,setTab]=useState("home");
  const [completeForm,setCompleteForm]=useState({email:"",dob:""});
  const [completing,setCompleting]=useState(false);
  const [showCelebration,setShowCelebration]=useState(false);
  const [celebData,setCelebData]=useState(null);
  const [pendingRedemptions,setPendingRedemptions]=useState([]);

  useEffect(()=>{
    (async()=>{
      const {data:c}=await api.clientByToken(token);
      if(!c){setNotFound(true);setLoading(false);return;}
      const sid=c.store_id||c.stores?.id;
      const [r,t,all,pr]=await Promise.all([api.listRewards(sid),api.listClientTx(c.id),api.listClients(sid),api.getClientPendingRedemptions(c.id)]);
      if(c.blocked){setNotFound(true);setLoading(false);return;}
      setClient(c);
      setRewards((r.data||[]).filter(rr=>rr.active));
      setTxs(t.data||[]);
      setAllClients(all.data||[]);
      setPendingRedemptions(pr.data||[]);
      setLoading(false);
      const lastTx=(t.data||[]).find(tx=>tx.type==="earn");
      if(lastTx){
        const minsAgo=(Date.now()-new Date(lastTx.created_at).getTime())/60000;
        const celebKey="roxo_celebrated_"+lastTx.id;
        const alreadyCelebrated=localStorage.getItem(celebKey);
        if(minsAgo<10&&!alreadyCelebrated){
          localStorage.setItem(celebKey,"1");
          const settings=c.stores?.settings||DEFAULT_SETTINGS;
          const newLevel=getLevel(c.points,settings.levels||DEFAULT_SETTINGS.levels);
          setCelebData({pts:lastTx.points,newPts:c.points,clientName:c.name,newLevel,prevLevel:newLevel,settings});
          setShowCelebration(true);
        }
      }
    })();
  },[token]);

  const handleRedeem=async(reward)=>{
    if(!client) return;
    if(client.points<reward.points_cost){setMsg({type:"error",text:"Pontos insuficientes 😔"});return;}
    const sid=client.store_id||client.stores?.id;
    const already=pendingRedemptions.find(function(r){return r.reward_id===reward.id;});
    if(already){setMsg({type:"error",text:"Você já tem uma solicitação pendente para esta recompensa."});return;}
    const res=await api.createRedemption(sid,client.id,reward.id,reward.name,reward.points_cost);
    if(res.error){setMsg({type:"error",text:res.error.message});return;}
    setPendingRedemptions(function(p){return p.concat([res.data]);});
    setMsg({type:"success",text:"⏳ Solicitação enviada! Aguarde a confirmação do atendente."});
    setTimeout(function(){setMsg(null);},6000);
  };

  const handleCancelMyRedemption=async(req_id)=>{
    await api.cancelRedemptionByClient(req_id);
    setPendingRedemptions(p=>p.filter(r=>r.id!==req_id));
    setMsg({type:"success",text:"Solicitação cancelada."});
    setTimeout(()=>setMsg(null),3000);
  };
  const handleComplete=async()=>{
    if(!completeForm.email&&!completeForm.dob){setMsg({type:"error",text:"Preencha pelo menos um campo"});return;}
    if(client.profile_completed){setMsg({type:"error",text:"Cadastro já foi completado anteriormente."});return;}
    const wasComplete=!!client.email&&!!client.dob;
    if(wasComplete){setMsg({type:"error",text:"Cadastro já está completo!"});return;}
    setCompleting(true);
    await api.updateClient(client.id,{
      email:completeForm.email||null,
      dob:completeForm.dob||null,
    });
    const nowEmail=completeForm.email||client.email;
    const nowDob=completeForm.dob||client.dob;
    if(nowEmail&&nowDob){
      const sid=client.store_id||client.stores?.id;
      const bonusPts=(client.stores?.settings?.bonus_complete_points)||50;
      await api.addBonusPoints(sid,client.id,bonusPts,"Bônus cadastro completo");
      await api.updateClient(client.id,{profile_completed:true});
      setClient(prev=>({...prev,...completeForm,points:prev.points+bonusPts,profile_completed:true}));
      setCompleting(false);
      setMsg({type:"success",text:`🎉 Cadastro completo! Você ganhou ${bonusPts} pontos de bônus!`});
    } else {
      setClient(prev=>({...prev,...completeForm}));
      setCompleting(false);
      setMsg({type:"success",text:"✅ Dados atualizados!"});
    }
    setTimeout(()=>setMsg(null),5000);
  };

  if(loading) return <div style={{minHeight:"100vh",background:C.r900,display:"flex",alignItems:"center",justifyContent:"center"}}><Spinner/></div>;
  if(notFound) return (
    <div style={{minHeight:"100vh",background:C.r900,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,gap:16}}>
      <Logo size={48}/>
      <div style={{color:C.r200,textAlign:"center",fontSize:15,lineHeight:1.7}}>Link inválido ou expirado.<br/>Peça ao atendente seu link pessoal.</div>
    </div>
  );

  const settings=client.stores?.settings||DEFAULT_SETTINGS;
  const levels=settings.levels||DEFAULT_SETTINGS.levels;
  const myLevel=getLevel(client.points,levels);
  const myInfo=getLevelInfo(myLevel,levels);
  const levelKeys=Object.keys(levels).sort((a,b)=>levels[a].min-levels[b].min);
  const nextLevelKey=levelKeys[levelKeys.indexOf(myLevel)+1];
  const nextLevel=nextLevelKey?levels[nextLevelKey]:null;
  const pctToNext=nextLevel?Math.min(100,Math.round(((client.points-myInfo.min)/(nextLevel.min-myInfo.min))*100)):100;
  const storeName=client.stores?.name||"RoxoClub";
  const isIncomplete=(!client.email||!client.dob)&&!client.profile_completed;
  const bonusPts=settings.bonus_complete_points||50;

  const clientTabs=[
    {id:"home",   icon:"🏠",label:"Início"},
    {id:"rewards",icon:"🎁",label:"Resgatar"},
    {id:"ranking",icon:"🏆",label:"Ranking"},
    {id:"history",icon:"📋",label:"Histórico"},
  ];

  return (
    <div style={{minHeight:"100vh",background:C.r900,fontFamily:"'Segoe UI',system-ui,sans-serif",maxWidth:480,margin:"0 auto"}}>
      {showCelebration&&celebData&&(
        <PointsCelebration {...celebData} onClose={()=>setShowCelebration(false)}/>
      )}
      
      <div style={{background:`linear-gradient(160deg,${C.r800},${C.r900})`,padding:"24px 20px 0"}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:18}}><Logo size={28}/></div>
        <div style={{background:"rgba(255,255,255,0.05)",borderRadius:20,padding:20,border:"1px solid rgba(255,255,255,0.08)"}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:18}}>
            <div style={{width:48,height:48,borderRadius:"50%",background:`linear-gradient(135deg,${C.r400},${C.r200})`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:20,color:C.white,flexShrink:0}}>{(client.name||"?")[0]}</div>
            <div>
              <div style={{color:C.r200,fontSize:11,marginBottom:1}}>Olá 👋 — {storeName}</div>
              <div style={{color:C.white,fontWeight:700,fontSize:18,fontFamily:"Georgia,serif"}}>{client.name.split(" ")[0]}</div>
              <LevelBadge levelKey={myLevel} levels={levels}/>
            </div>
          </div>
          <div style={{textAlign:"center",marginBottom:18}}>
            <div style={{color:C.r200,fontSize:10,letterSpacing:2,textTransform:"uppercase",marginBottom:3}}>Seus pontos</div>
            <div style={{color:C.white,fontSize:56,fontWeight:700,lineHeight:1,fontFamily:"Georgia,serif"}}>{fmtPts(client.points)}</div>
            <div style={{color:C.r300,fontSize:12,marginTop:3}}>pontos disponíveis</div>
          </div>
          {nextLevel?(
            <div>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                <span style={{color:C.r300,fontSize:11}}>→ {nextLevel.name}</span>
                <span style={{color:C.r200,fontSize:11}}>{pctToNext}%</span>
              </div>
              <div style={{background:"rgba(255,255,255,0.08)",borderRadius:8,height:7,overflow:"hidden"}}>
                <div style={{width:`${pctToNext}%`,height:"100%",background:`linear-gradient(90deg,${C.r400},${C.r200})`,borderRadius:8,transition:"width 1.2s ease"}}/>
              </div>
              <div style={{fontSize:11,color:C.r300,marginTop:4}}>Faltam {fmtPts(nextLevel.min-client.points)} pts</div>
            </div>
          ):(
            <div style={{textAlign:"center",padding:"7px 12px",background:"rgba(245,158,11,0.15)",borderRadius:9,color:C.gold,fontSize:13,fontWeight:600}}>🏆 Nível máximo! Você é incrível!</div>
          )}
        </div>
      </div>

      
      <div style={{display:"flex",background:"rgba(255,255,255,0.04)",borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
        {clientTabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"10px 0",background:"transparent",border:"none",borderBottom:tab===t.id?`2px solid ${C.r300}`:"2px solid transparent",color:tab===t.id?C.r200:"rgba(255,255,255,0.35)",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <span style={{fontSize:18}}>{t.icon}</span>
            <span style={{fontSize:10,fontWeight:tab===t.id?700:400}}>{t.label}</span>
          </button>
        ))}
      </div>

      
      <div style={{background:C.r50,minHeight:"60vh",padding:"20px 16px"}}>
        {msg&&<div style={{padding:"12px 15px",borderRadius:11,marginBottom:14,background:msg.type==="success"?"#d1fae5":"#fee2e2",color:msg.type==="success"?C.greenD:C.red,fontWeight:500,fontSize:14,animation:"fadeUp 0.3s ease"}}>{msg.text}</div>}

        
        {isIncomplete&&tab==="home"&&(
          <div style={{background:"#fffbeb",borderRadius:14,padding:16,marginBottom:16,border:"1px solid #fcd34d"}}>
            <div style={{fontWeight:700,color:"#92400e",marginBottom:4}}>⚠️ Complete seu cadastro e ganhe {bonusPts} pontos!</div>
            <div style={{fontSize:13,color:"#78350f",marginBottom:12}}>Adicione e-mail e data de nascimento para benefícios exclusivos no seu aniversário!</div>
            {!client.email&&<Input label="E-mail" type="email" value={completeForm.email} onChange={e=>setCompleteForm({...completeForm,email:e.target.value})} placeholder="seu@email.com"/>}
            {!client.dob&&(
              <div style={{marginBottom:12}}>
                <div style={{fontSize:12,fontWeight:600,color:C.g700,marginBottom:5}}>Data de nascimento <span style={{color:C.g400,fontWeight:400}}>(DD/MM/AAAA)</span></div>
                <input type="text" inputMode="numeric"
                  value={completeForm.dobMask||""}
                  onChange={e=>{const m=fmtDobMask(e.target.value);setCompleteForm({...completeForm,dobMask:m,dob:dobMaskToISO(m)});}}
                  placeholder="01/01/1990" maxLength={10}
                  style={{width:"100%",padding:"9px 12px",borderRadius:9,border:`1.5px solid ${C.g200}`,fontSize:14,outline:"none",background:C.white}}/>
              </div>
            )}
            <Btn sm loading={completing} onClick={handleComplete}>Completar e ganhar {bonusPts} pts 🎁</Btn>
          </div>
        )}

        {tab==="home"&&(
          <div>
            {pendingRedemptions.length>=1&&(
              <div style={{background:"#fef9c3",borderRadius:14,padding:16,marginBottom:16,border:"1px solid #fde68a"}}>
                <div style={{fontWeight:700,fontSize:14,color:"#92400e",marginBottom:10}}>⏳ Resgates Aguardando Aprovação</div>
                {pendingRedemptions.map(req=>(
                  <div key={req.id} style={{background:C.white,borderRadius:10,padding:"10px 14px",marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>
                      <div style={{fontWeight:600,fontSize:13,color:C.g900}}>🎁 {req.reward_name}</div>
                      <div style={{fontSize:11,color:C.g500,marginTop:2}}>{fmtDate(req.created_at)}</div>
                    </div>
                    <button onClick={()=>handleCancelMyRedemption(req.id)} style={{padding:"5px 10px",borderRadius:8,border:"1px solid #e5e7eb",background:"transparent",color:C.g500,fontSize:12,cursor:"pointer"}}>Cancelar</button>
                  </div>
                ))}
              </div>
            )}
            <div style={{fontWeight:700,color:C.g900,marginBottom:10,fontSize:15}}>🎁 Recompensas em destaque</div>
            {rewards.slice(0,3).map(r=>{
              const can=client.points>=r.points_cost;
              return (
                <div key={r.id} style={{background:C.white,borderRadius:13,padding:"13px 15px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,border:`1px solid ${can?"#e9d5ff":C.g100}`,opacity:can?1:0.7}}>
                  <div style={{display:"flex",gap:11,alignItems:"center"}}>
                    <span style={{fontSize:26}}>{r.type==="product"?"🍇":"💸"}</span>
                    <div><div style={{fontWeight:700,fontSize:13,color:C.g900}}>{r.name}</div><div style={{color:C.r500,fontWeight:600,fontSize:12}}>{fmtPts(r.points_cost)} pts</div></div>
                  </div>
                  <button onClick={()=>handleRedeem(r)} style={{padding:"7px 13px",borderRadius:9,border:"none",background:can?C.r400:C.g200,color:can?C.white:C.g600,fontWeight:600,fontSize:12,cursor:can?"pointer":"not-allowed"}}>
                    {can?"Resgatar":"Insuf."}
                  </button>
                </div>
              );
            })}
            {rewards.length>3&&<div onClick={()=>setTab("rewards")} style={{textAlign:"center",fontSize:13,color:C.r500,cursor:"pointer",padding:8,fontWeight:600}}>Ver todas →</div>}

            <div style={{fontWeight:700,color:C.g900,marginBottom:8,marginTop:18,fontSize:15}}>📋 Últimas atividades</div>
            {txs.slice(0,5).map(t=>(
              <div key={t.id} style={{background:C.white,borderRadius:11,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7,border:`1px solid ${C.g100}`}}>
                <div>
                  <div style={{fontWeight:600,fontSize:13,color:C.g900}}>{t.note||"Atividade"}</div>
                  <div style={{fontSize:11,color:C.g400}}>{fmtDateTime(t.created_at)}</div>
                </div>
                <span style={{fontWeight:700,color:t.type==="earn"?C.green:C.red,fontSize:13}}>{t.type==="earn"?"+":""}{t.points} pts</span>
              </div>
            ))}
          </div>
        )}

        {tab==="rewards"&&(
          <div>
            <div style={{fontWeight:700,color:C.g900,marginBottom:12,fontSize:15}}>🎁 Todas as recompensas</div>
            {rewards.length===0&&<div style={{color:C.g400,textAlign:"center",padding:24}}>Nenhuma recompensa disponível</div>}
            {rewards.map(r=>{
              const can=client.points>=r.points_cost;
              const pct=Math.min(100,Math.round((client.points/r.points_cost)*100));
              return (
                <div key={r.id} style={{background:C.white,borderRadius:14,padding:16,marginBottom:10,border:`1px solid ${can?"#c084fc":C.g100}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                    <div style={{display:"flex",gap:10,alignItems:"center"}}>
                      <span style={{fontSize:26}}>{r.type==="product"?"🍇":"💸"}</span>
                      <div>
                        <div style={{fontWeight:700,fontSize:14,color:C.g900}}>{r.name}</div>
                        {r.description&&<div style={{fontSize:12,color:C.g600}}>{r.description}</div>}
                        {r.tag&&<span style={{padding:"2px 8px",borderRadius:20,fontSize:10,fontWeight:700,background:r.tag==="hot"?C.redL:r.tag==="best"?C.greenL:C.blueL,color:r.tag==="hot"?C.red:r.tag==="best"?C.greenD:C.blueD}}>{r.tag==="hot"?"🔥 Popular":r.tag==="best"?"💰 Melhor custo":"✨ Novo"}</span>}
                      </div>
                    </div>
                    <button onClick={()=>handleRedeem(r)} style={{padding:"7px 14px",borderRadius:9,border:"none",background:can?C.r400:C.g200,color:can?C.white:C.g600,fontWeight:600,fontSize:13,cursor:can?"pointer":"not-allowed",flexShrink:0}}>
                      {can?"Resgatar":"Insuf."}
                    </button>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <div style={{flex:1,background:C.g100,borderRadius:6,height:6,overflow:"hidden"}}>
                      <div style={{width:`${pct}%`,height:"100%",background:can?C.green:C.r400,borderRadius:6}}/>
                    </div>
                    <span style={{fontSize:11,color:C.g600,whiteSpace:"nowrap"}}>{fmtPts(client.points)}/{fmtPts(r.points_cost)}</span>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {tab==="ranking"&&(
          <RankingPanel client={client} allClients={allClients} settings={settings}/>
        )}

        {tab==="history"&&(
          <div>
            <div style={{fontWeight:700,color:C.g900,marginBottom:12,fontSize:15}}>📋 Histórico completo</div>
            {txs.length===0&&<div style={{color:C.g400,textAlign:"center",padding:24}}>Nenhuma atividade ainda</div>}
            {txs.map(t=>(
              <div key={t.id} style={{background:C.white,borderRadius:11,padding:"11px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7,border:`1px solid ${C.g100}`}}>
                <div style={{display:"flex",gap:9,alignItems:"center"}}>
                  <div style={{width:30,height:30,borderRadius:7,background:t.type==="earn"?C.greenL:C.redL,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>{t.type==="earn"?"⬆️":"🎁"}</div>
                  <div>
                    <div style={{fontWeight:600,fontSize:13,color:C.g900}}>{t.note||"Atividade"}</div>
                    <div style={{fontSize:11,color:C.g400}}>{fmtDateTime(t.created_at)}</div>
                  </div>
                </div>
                <span style={{fontWeight:700,color:t.type==="earn"?C.green:C.red,fontSize:13}}>{t.type==="earn"?"+":""}{t.points} pts</span>
              </div>
            ))}
          </div>
        )}

        <div style={{marginTop:20,textAlign:"center",fontSize:11,color:C.g400}}>💜 <strong>RoxoClub</strong> — <em>Fidelidade</em></div>
      </div>
    </div>
  );
}

function App() {
  const [session,setSession]=useState(undefined);
  const [store,setStore]=useState(null);
  const [view,setView]=useState("loading");
  const urlToken=new URLSearchParams(window.location.search).get("token");

  useEffect(()=>{
    if(urlToken){setView("client");return;}
    api.getSession().then(({data})=>{
      const s=data?.session;setSession(s||null);
      if(!s){setView("auth");return;}
      api.getStore(s.user.id).then(({data:st})=>{
        if(!st){setView("onboarding");return;}
        setStore(st);setView("admin");
      });
    });
    const {data:{subscription}}=sb.auth.onAuthStateChange((ev,s)=>{
      setSession(s);if(!s){setStore(null);setView("auth");}
    });
    return()=>subscription.unsubscribe();
  },[urlToken]);

  const handleAuth=async(su)=>{
    const uid=su?.user?.id||su?.id;
    const {data:st}=await api.getStore(uid);
    if(!st){setView("onboarding");return;}
    setStore(st);setView("admin");
  };

  if(view==="client")  return <ClientPortal token={urlToken}/>;
  if(view==="loading") return <div style={{minHeight:"100vh",background:C.r900,display:"flex",alignItems:"center",justifyContent:"center"}}><Spinner/></div>;
  if(view==="auth")    return <AuthScreen onAuth={handleAuth}/>;
  if(view==="onboarding"&&session) return <OnboardingScreen user={session.user} onDone={st=>{setStore(st);setView("admin");}}/>;
  if(view==="admin"&&session&&store) return <AdminPanel user={session.user} store={store} onSignOut={async()=>{await api.signOut();setSession(null);setStore(null);setView("auth");}}/>;
  return <AuthScreen onAuth={handleAuth}/>;
}

ReactDOM.render(<App/>,document.getElementById("root"));

</script>
</body>
</html>
